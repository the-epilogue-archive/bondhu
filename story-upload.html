<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — স্টোরি তৈরি</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  .upload-card{
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:22px;
    margin-top:16px;
    box-shadow:var(--shadow-sm);
  }
  .info-banner{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:var(--gold-soft);
    border:1px solid var(--rule-dark);
    border-radius:10px;
    margin-bottom:16px;
    font-size:12px;
    color:var(--ink-soft);
    font-style:italic;
    font-family:'Playfair Display',serif;
  }
  .info-banner svg{
    width:18px;height:18px;
    stroke:var(--gold);fill:none;stroke-width:1.8;
    flex-shrink:0;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .drop-zone{
    aspect-ratio:9/16;
    max-height:460px;
    border:2px dashed var(--rule-dark);
    border-radius:12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    background:var(--paper-2);
    position:relative;
    overflow:hidden;
    margin-bottom:16px;
  }
  .drop-zone:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
    transform:translateY(-2px);
  }
  .drop-zone svg{
    width:56px;height:56px;
    stroke:var(--ink-mute);fill:none;stroke-width:1.5;
    stroke-linecap:round;stroke-linejoin:round;
    transition:stroke .3s,transform .3s;
  }
  .drop-zone:hover svg{stroke:var(--accent);transform:scale(1.1)}
  .drop-zone-text{
    font-size:13px;color:var(--ink-mute);
    text-align:center;line-height:1.5;padding:0 20px;
  }
  .drop-zone-text b{color:var(--ink-soft);font-family:'Playfair Display',serif;font-size:15px;display:block;margin-bottom:4px}
  .drop-zone img{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    display:none;
  }
  .drop-zone.has-image{border-style:solid;border-color:var(--accent-border)}
  .drop-zone.has-image img{display:block}
  .drop-zone.has-image .drop-zone-inner{display:none}
</style>
</head>
<body>

<div class="page">

  <nav class="topbar">
    <div class="topbar-brand" style="font-size:18px">স্টোরি তৈরি</div>
    <div class="topbar-actions">
      <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="index.html" class="icon-btn" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
    </div>
  </nav>

  <div class="section-head">নতুন স্টোরি</div>

  <div class="upload-card">

    <div class="info-banner">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      ২৪ ঘণ্টা পরে স্টোরি স্বয়ংক্রিয়ভাবে মুছে যাবে
    </div>

    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <img id="preview" alt="">
      <div class="drop-zone-inner" style="text-align:center">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        <div class="drop-zone-text" style="margin-top:12px">
          <b>ছবি যুক্ত করুন</b>
          ক্লিক করুন বা টেনে আনুন
        </div>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="field">
      <label class="field-label">ক্যাপশন (ঐচ্ছিক)</label>
      <textarea class="textarea" id="captionInput" placeholder="কিছু লিখুন..." maxlength="150" style="min-height:60px"></textarea>
      <div style="text-align:right;font-size:11px;color:var(--ink-mute);margin-top:6px;font-family:'Playfair Display',serif;font-style:italic"><span id="charCount">0</span> / 150</div>
    </div>

    <button class="btn" id="postBtn" type="button">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      স্টোরি প্রকাশ করুন
    </button>

    <div class="alert" id="status"></div>
  </div>

</div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></a>
  <a href="upload.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg></a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></a>
</nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { uploadToGitHub, hasToken } from "./js/upload.js";
  import { createStory } from "./js/stories.js";

  requireAuth(() => {});

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const preview = document.getElementById("preview");
  const captionInput = document.getElementById("captionInput");
  const charCount = document.getElementById("charCount");
  const postBtn = document.getElementById("postBtn");
  const status = document.getElementById("status");

  captionInput.addEventListener("input", () => {
    charCount.textContent = captionInput.value.length;
  });

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (f) {
      preview.src = URL.createObjectURL(f);
      dropZone.classList.add("has-image");
    }
  });

  function showStatus(type, msg) {
    status.className = "alert " + type + " show";
    status.textContent = msg;
  }

  postBtn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    if (!file) { showStatus("err", "প্রথমে একটি ছবি নির্বাচন করুন"); return; }
    if (!hasToken()) { showStatus("err", "সেটিংসে GitHub টোকেন সেট করুন"); return; }

    postBtn.disabled = true;
    showStatus("info", "আপলোড হচ্ছে... ⏳");

    try {
      const imageUrl = await uploadToGitHub(file, "stories");
      await createStory(imageUrl, captionInput.value.trim());
      showStatus("ok", "✅ স্টোরি প্রকাশিত! ফিডে যাচ্ছি...");
      setTimeout(() => window.location.href = "index.html", 1000);
    } catch (e) {
      showStatus("err", "❌ " + e.message);
      postBtn.disabled = false;
    }
  });
</script>

</body>
</html>
