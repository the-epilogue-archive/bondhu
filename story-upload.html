<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Story</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #fafafa; margin: 0 auto; padding: 20px; max-width: 500px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .topbar h2 { color: #e1306c; margin: 0; }
    .topbar a { color: #e1306c; text-decoration: none; font-weight: bold; }
    .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    input[type="file"] { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
    textarea {
      width: 100%; padding: 12px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px; font-family: inherit;
      resize: vertical; min-height: 60px; margin-top: 10px; box-sizing: border-box;
    }
    button {
      width: 100%; background: #e1306c; color: white; border: none;
      padding: 14px; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer; margin-top: 12px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 15px; padding: 10px; border-radius: 8px;
      font-size: 14px; display: none; white-space: pre-wrap; word-break: break-word;
    }
    .ok { background: #d4edda; color: #155724; display: block; }
    .err { background: #f8d7da; color: #721c24; display: block; }
    .info { background: #d1ecf1; color: #0c5460; display: block; }
    #preview { margin-top: 15px; max-width: 100%; border-radius: 8px; display: none; max-height: 400px; object-fit: contain; }
    .info-box {
      background: #fff8e1; padding: 10px; border-radius: 8px;
      font-size: 13px; color: #666; margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h2>Story banao</h2>
    <a href="index.html">← Feed</a>
  </div>

  <div class="box">
    <div class="info-box">⏰ Story 24 ghonta por auto delete hobe</div>
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="preview">
    <textarea id="captionInput" placeholder="Caption (optional)"></textarea>
    <button id="postBtn" type="button">Story post koro</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { uploadToGitHub, hasToken } from "./js/upload.js";
    import { createStory } from "./js/stories.js";

    requireAuth(() => {});

    const fileInput = document.getElementById("fileInput");
    const captionInput = document.getElementById("captionInput");
    const postBtn = document.getElementById("postBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    function showStatus(cls, msg) {
      status.className = cls;
      status.style.display = "block";
      status.textContent = msg;
    }

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (f) {
        preview.src = URL.createObjectURL(f);
        preview.style.display = "block";
      }
    });

    postBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) { showStatus("err", "Image select koro"); return; }
      if (!hasToken()) { showStatus("err", "Settings page e giye GitHub token set koro"); return; }

      postBtn.disabled = true;
      showStatus("info", "Upload hocche... ⏳");

      try {
        const imageUrl = await uploadToGitHub(file, "stories");
        await createStory(imageUrl, captionInput.value.trim());
        showStatus("ok", "✅ Story post hoyeche! Feed e jaccho...");
        setTimeout(() => window.location.href = "index.html", 1200);
      } catch (e) {
        console.error(e);
        showStatus("err", "❌ " + (e.message || "Unknown error"));
        postBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
