<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — প্রোফাইল</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  .profile-header{padding:20px 0 22px;text-align:center;border-bottom:1px solid var(--rule)}
  .avatar-wrap{position:relative;display:inline-block;margin-bottom:16px}
  .profile-avatar{
    width:96px;height:96px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:700;font-size:36px;
    overflow:hidden;
    box-shadow:var(--shadow-md);
    border:3px solid var(--paper-elev);
    position:relative;
    background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);
  }
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .avatar-ring{
    position:absolute;inset:-6px;border-radius:50%;
    border:2px dashed var(--gold);
    pointer-events:none;
    animation:spinRing 30s linear infinite;
  }
  @keyframes spinRing{to{transform:rotate(360deg)}}

  .profile-name{
    font-family:'Playfair Display',serif;
    font-size:24px;font-weight:700;
    color:var(--ink);letter-spacing:-.3px;
    margin-bottom:4px;
  }
  .profile-username{
    font-size:13px;color:var(--ink-mute);
    font-style:italic;
    font-family:'Playfair Display',serif;
    margin-bottom:10px;
  }
  .profile-bio{
    font-size:13.5px;color:var(--ink-soft);
    line-height:1.6;
    max-width:320px;
    margin:0 auto 18px;
    padding:0 8px;
  }

  .stats-row{
    display:flex;justify-content:center;gap:32px;
    padding:14px 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    margin-top:6px;
  }
  .stat{text-align:center;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .stat:hover{transform:translateY(-2px)}
  .stat-num{
    font-family:'Playfair Display',serif;
    font-size:22px;font-weight:700;color:var(--ink);
    line-height:1;
  }
  .stat-label{
    font-size:10px;color:var(--ink-mute);
    letter-spacing:1.2px;text-transform:uppercase;
    font-weight:600;margin-top:6px;
  }

  .profile-actions{
    display:flex;gap:8px;
    padding:16px 0 0;
  }
  .profile-actions .btn{flex:1}

  .tabs{
    display:flex;gap:4px;
    padding:20px 0 4px;
    border-bottom:1px solid var(--rule);
  }
  .tab{
    flex:1;padding:10px;
    text-align:center;
    font-size:12px;font-weight:600;
    color:var(--ink-mute);
    letter-spacing:1.2px;
    text-transform:uppercase;
    border-bottom:2px solid transparent;
    transition:all .3s;
    cursor:pointer;
  }
  .tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  .posts-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
    padding-top:14px;
  }
  .grid-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:2px;
    background:var(--paper-deep);
    cursor:pointer;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  }
  .grid-item:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:var(--shadow-md);
    z-index:2;
  }
  .grid-item img{width:100%;height:100%;object-fit:cover}
  .grid-item .overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.5));
    display:flex;align-items:flex-end;padding:6px;
    opacity:0;transition:opacity .3s;
    color:#fff;font-size:10px;font-weight:600;
  }
  .grid-item:hover .overlay{opacity:1}
</style>
</head>
<body>

<div class="page">

  <nav class="topbar">
    <div class="topbar-brand" style="font-size:18px">প্রোফাইল</div>
    <div class="topbar-actions">
      <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="settings.html" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </nav>

  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div>লোড হচ্ছে...</div>
  </div>

  <div id="profileContent" style="display:none">
    <div class="profile-header">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="profile-avatar" id="avatarBig">?</div>
      </div>
      <div class="profile-name" id="profileName">...</div>
      <div class="profile-username" id="profileUsername">@...</div>
      <div class="profile-bio" id="profileBio"></div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="postCount">0</div>
          <div class="stat-label">পোস্ট</div>
        </div>
        <div class="stat" onclick="location.href='#'">
          <div class="stat-num" id="followerCount">0</div>
          <div class="stat-label">অনুসারী</div>
        </div>
        <div class="stat" onclick="location.href='#'">
          <div class="stat-num" id="followingCount">0</div>
          <div class="stat-label">অনুসরণ</div>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-ghost btn-sm" id="editBtn" style="flex:1">
          <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          সম্পাদনা
        </button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="flex:1">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          প্রস্থান
        </button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="posts">পোস্ট</div>
      <div class="tab" data-tab="about">পরিচিতি</div>
    </div>

    <div id="tabPosts">
      <div class="posts-grid" id="postsGrid"></div>
    </div>
    <div id="tabAbout" style="display:none">
      <div class="card" style="margin-top:16px">
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.7">
          <div style="margin-bottom:8px"><strong style="color:var(--ink)">ইমেইল:</strong> <span id="aboutEmail">—</span></div>
          <div style="margin-bottom:8px"><strong style="color:var(--ink)">ইউজারনেম:</strong> <span id="aboutUsername">—</span></div>
          <div><strong style="color:var(--ink)">যোগদান:</strong> <span id="aboutJoined">—</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<a href="upload.html" class="fab" aria-label="New post">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</a>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></a>
  <a href="upload.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg></a>
  <a href="profile.html" class="active"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></a>
</nav>

<script type="module">
  import { requireAuth, logout, updateUserData } from "./js/auth.js";
  import { loadUserPosts, deletePost } from "./js/feed.js";

  let currentUser = null;

  requireAuth(async (user) => {
    currentUser = user;
    document.getElementById("loading").style.display = "none";
    document.getElementById("profileContent").style.display = "block";
    render(user);
    loadPosts(user.uid);
  });

  function render(user) {
    const initial = (user.name || "?")[0].toUpperCase();
    const avatarBig = document.getElementById("avatarBig");
    avatarBig.innerHTML = user.photoURL ? `<img src="${user.photoURL}">` : initial;

    document.getElementById("profileName").textContent = user.name || "?";
    document.getElementById("profileUsername").textContent = "@" + (user.username || "?");
    document.getElementById("profileBio").textContent = user.bio || "কোনো পরিচিতি নেই";

    document.getElementById("followerCount").textContent = (user.followers || []).length;
    document.getElementById("followingCount").textContent = (user.following || []).length;

    document.getElementById("aboutEmail").textContent = user.email || "—";
    document.getElementById("aboutUsername").textContent = "@" + (user.username || "?");
    if (user.createdAt) {
      const d = user.createdAt.seconds ? new Date(user.createdAt.seconds * 1000) : new Date(user.createdAt);
      document.getElementById("aboutJoined").textContent = d.toLocaleDateString("bn-BD");
    }
  }

  async function loadPosts(uid) {
    const grid = document.getElementById("postsGrid");
    try {
      const posts = await loadUserPosts(uid);
      document.getElementById("postCount").textContent = posts.length;
      if (posts.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          এখনো কোনো পোস্ট নেই
        </div>`;
        return;
      }
      grid.innerHTML = posts.map(p =>
        `<div class="grid-item" data-id="${p.id}">
          <img src="${p.imageUrl}" alt="post" loading="lazy">
          <div class="overlay">❤️ ${p.likes?.length || 0}</div>
        </div>`
      ).join("");

      grid.querySelectorAll(".grid-item").forEach(item => {
        item.addEventListener("click", async () => {
          if (!confirm("এই পোস্টটি মুছে ফেলবেন?")) return;
          try {
            await deletePost(item.dataset.id);
            item.remove();
            const c = document.getElementById("postCount");
            c.textContent = Math.max(0, parseInt(c.textContent) - 1);
          } catch (e) { alert("Delete fail: " + e.message); }
        });
      });
    } catch (e) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">❌ ${e.message}</div>`;
    }
  }

  document.getElementById("editBtn").addEventListener("click", async () => {
    const name = prompt("নতুন নাম:", currentUser.name);
    if (name === null) return;
    const bio = prompt("নতুন পরিচিতি:", currentUser.bio || "");
    if (bio === null) return;
    try {
      await updateUserData(currentUser.uid, { name: name.trim() || currentUser.name, bio: bio.trim() });
      location.reload();
    } catch (e) { alert("Update fail: " + e.message); }
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    if (!confirm("প্রস্থান করবেন?")) return;
    await logout();
    window.location.href = "login.html";
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.dataset.tab;
      document.getElementById("tabPosts").style.display = which === "posts" ? "block" : "none";
      document.getElementById("tabAbout").style.display = which === "about" ? "block" : "none";
    });
  });
</script>

</body>
</html>
