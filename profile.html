<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — প্রোফাইল</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  /* ============ PROFILE HEADER ============ */
  .profile-header{
    padding:22px 0 22px;
    text-align:center;
    border-bottom:1px solid var(--rule);
  }
  .avatar-wrap{
    position:relative;
    display:inline-block;
    margin-bottom:16px;
  }
  .profile-avatar{
    width:100px;height:100px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:38px;
    overflow:hidden;
    box-shadow:0 8px 24px var(--shadow-md);
    border:3px solid var(--paper-elev);
    position:relative;
    background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);
    transition:transform .3s;
  }
  .profile-avatar:hover{transform:scale(1.03)}
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .avatar-ring{
    position:absolute;inset:-6px;border-radius:50%;
    border:2px dashed var(--gold);
    pointer-events:none;
    animation:spinRing 30s linear infinite;
  }
  @keyframes spinRing{to{transform:rotate(360deg)}}

  .profile-name{
    font-family:'Playfair Display',serif;
    font-size:24px;font-weight:700;
    color:var(--ink);letter-spacing:-.3px;
    margin-bottom:4px;
  }
  .profile-username{
    font-size:13px;color:var(--ink-mute);
    font-style:italic;font-family:'Playfair Display',serif;
    margin-bottom:10px;
  }
  .profile-bio{
    font-size:13.5px;color:var(--ink-soft);
    line-height:1.6;max-width:320px;
    margin:0 auto 18px;padding:0 8px;
  }

  /* ============ STATS ============ */
  .stats-row{
    display:flex;
    justify-content:center;
    gap:32px;
    padding:14px 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
    margin-top:6px;
  }
  .stat{text-align:center;cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .stat:hover{transform:translateY(-2px)}
  .stat-num{
    font-family:'Playfair Display',serif;
    font-size:22px;font-weight:700;color:var(--ink);line-height:1;
  }
  .stat-label{
    font-size:10px;color:var(--ink-mute);
    letter-spacing:1.2px;text-transform:uppercase;
    font-weight:600;margin-top:6px;
  }

  /* ============ ACTIONS ============ */
  .profile-actions{
    display:flex;gap:8px;
    padding:16px 0 0;
  }
  .profile-actions .btn{flex:1}

  /* ============ TABS ============ */
  .tabs{
    display:flex;gap:4px;
    padding:20px 0 4px;
    border-bottom:1px solid var(--rule);
    margin-bottom:0;
  }
  .tab{
    flex:1;padding:10px;
    text-align:center;
    font-size:12px;font-weight:600;
    color:var(--ink-mute);
    letter-spacing:1.2px;
    text-transform:uppercase;
    border-bottom:2px solid transparent;
    transition:all .3s;
    cursor:pointer;
  }
  .tab.active{
    color:var(--accent);
    border-bottom-color:var(--accent);
  }

  /* ============ POSTS GRID ============ */
  .posts-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:3px;
    padding-top:14px;
  }
  .grid-item{
    position:relative;
    aspect-ratio:1/1;
    overflow:hidden;
    border-radius:2px;
    background:var(--paper-deep);
    cursor:pointer;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;
  }
  .grid-item:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:var(--shadow-md);
    z-index:2;
  }
  .grid-item img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .grid-item:hover img{transform:scale(1.06)}
  .grid-item .overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));
    display:flex;align-items:flex-end;
    padding:8px;
    opacity:0;
    transition:opacity .3s;
    color:#fff;font-size:11px;font-weight:600;
    gap:10px;
  }
  .grid-item:hover .overlay{opacity:1}
  .grid-item .overlay span{
    display:inline-flex;align-items:center;gap:4px;
  }
  .grid-item .overlay svg{
    width:13px;height:13px;
    stroke:currentColor;fill:none;stroke-width:2;
  }
  .grid-item .overlay .liked svg{fill:#ff4d6d;stroke:#ff4d6d}

  /* ============ MODAL ============ */
  .post-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:16px;
    opacity:0;
    transition:opacity .25s;
  }
  .post-modal.show{display:flex;opacity:1}
  .post-modal-box{
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:18px;
    max-width:640px;
    width:100%;
    max-height:92vh;
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    transform:scale(.94);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .post-modal.show .post-modal-box{transform:scale(1)}

  .modal-close{
    position:absolute;
    top:12px;right:12px;
    width:36px;height:36px;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    color:#fff;
    border:none;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    z-index:3;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s;
  }
  .modal-close:hover{background:rgba(198,40,40,.9);transform:scale(1.1) rotate(90deg)}
  .modal-close svg{
    width:18px;height:18px;
    stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;
  }

  .modal-image{
    background:#000;
    border-radius:18px 18px 0 0;
    overflow:hidden;
    max-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .modal-image img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    display:block;
  }

  .modal-body{
    padding:20px;
  }
  .modal-author{
    display:flex;
    align-items:center;
    gap:12px;
    padding-bottom:16px;
    border-bottom:1px solid var(--rule);
    margin-bottom:16px;
  }
  .modal-avatar{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:16px;
    overflow:hidden;flex-shrink:0;
  }
  .modal-avatar img{width:100%;height:100%;object-fit:cover}
  .modal-author-info{flex:1;min-width:0}
  .modal-author-name{
    font-family:'Playfair Display',serif;
    font-weight:700;font-size:15px;
    color:var(--ink);
  }
  .modal-author-handle{
    font-size:12px;color:var(--ink-mute);
    font-style:italic;
    font-family:'Playfair Display',serif;
    margin-top:2px;
  }
  .modal-time{
    font-size:11px;color:var(--ink-mute);
    font-style:italic;
    font-family:'Playfair Display',serif;
  }

  .modal-caption{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink-soft);
    padding-bottom:16px;
    border-bottom:1px solid var(--rule);
    margin-bottom:16px;
    word-break:break-word;
  }
  .modal-caption b{
    font-family:'Playfair Display',serif;
    color:var(--ink);
    font-weight:700;
  }

  .modal-stats{
    display:flex;
    gap:20px;
    margin-bottom:16px;
  }
  .modal-stat{
    display:flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;
    color:var(--ink-soft);
  }
  .modal-stat svg{
    width:18px;height:18px;
    stroke:currentColor;fill:none;stroke-width:1.8;
  }
  .modal-stat.liked{
    color:#e1306c;
  }
  .modal-stat.liked svg{fill:#e1306c;stroke:#e1306c}

  .modal-actions{
    display:flex;
    gap:8px;
    padding-top:14px;
    border-top:1px solid var(--rule);
  }
  .modal-actions button,
  .modal-actions a{
    flex:1;
    padding:11px;
    border-radius:10px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--rule);
    background:var(--paper-2);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s,border-color .3s;
    text-decoration:none;
  }
  .modal-actions button:hover,
  .modal-actions a:hover{
    background:var(--accent-soft);
    border-color:var(--accent-border);
    transform:translateY(-2px);
  }
  .modal-actions .danger{
    background:rgba(198,40,40,.08);
    border-color:rgba(198,40,40,.2);
    color:#c62828;
  }
  .modal-actions .danger:hover{
    background:rgba(198,40,40,.15);
    border-color:rgba(198,40,40,.4);
  }
  .modal-actions svg{
    width:16px;height:16px;
    stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
  }

  @media (max-width:480px){
    .post-modal{padding:8px}
    .modal-image{max-height:60vh}
    .modal-image img{max-height:60vh}
  }
</style>
</head>
<body>

<div class="page">

  <nav class="topbar">
    <div class="topbar-brand" style="font-size:18px">প্রোফাইল</div>
    <div class="topbar-actions">
      <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="settings.html" class="icon-btn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </div>
  </nav>

  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div>লোড হচ্ছে...</div>
  </div>

  <div id="profileContent" style="display:none">
    <div class="profile-header">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="profile-avatar" id="avatarBig">?</div>
      </div>
      <div class="profile-name" id="profileName">...</div>
      <div class="profile-username" id="profileUsername">@...</div>
      <div class="profile-bio" id="profileBio"></div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="postCount">0</div>
          <div class="stat-label">পোস্ট</div>
        </div>
        <div class="stat" onclick="location.href='#'">
          <div class="stat-num" id="followerCount">0</div>
          <div class="stat-label">অনুসারী</div>
        </div>
        <div class="stat" onclick="location.href='#'">
          <div class="stat-num" id="followingCount">0</div>
          <div class="stat-label">অনুসরণ</div>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-ghost btn-sm" id="editBtn" style="flex:1">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          সম্পাদনা
        </button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="flex:1">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><polyline points="16 17 21 12 16 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><line x1="21" y1="12" x2="9" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          প্রস্থান
        </button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="posts">পোস্ট</div>
      <div class="tab" data-tab="about">পরিচিতি</div>
    </div>

    <div id="tabPosts">
      <div class="posts-grid" id="postsGrid"></div>
    </div>
    <div id="tabAbout" style="display:none">
      <div class="card" style="margin-top:16px">
        <div style="font-size:13px;color:var(--ink-soft);line-height:1.8">
          <div style="margin-bottom:10px"><strong style="color:var(--ink)">ইউজারনেম:</strong> <span id="aboutUsername">—</span></div>
          <div><strong style="color:var(--ink)">যোগদান:</strong> <span id="aboutJoined">—</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ============ POST DETAIL MODAL ============ -->
<div class="post-modal" id="postModal">
  <div class="post-modal-box">
    <button class="modal-close" id="modalClose">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="modalContent"></div>
  </div>
</div>

<a href="upload.html" class="fab" aria-label="New post">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</a>

<nav data-component="bottom-nav" data-active="profile"></nav>

<script type="module">
  import { requireAuth, logout, updateUserData } from "./js/auth.js";
  import { loadUserPosts, deletePost, toggleLike, loadComments, addComment } from "./js/feed.js";
  import { showToast, showConfirm } from "./js/toast.js";
  import "./js/components.js";

  let currentUser = null;
  let userPosts = [];

  requireAuth(async (user) => {
    currentUser = user;
    document.getElementById("loading").style.display = "none";
    document.getElementById("profileContent").style.display = "block";
    render(user);
    loadPosts(user.uid);
  });

  function render(user) {
    const initial = (user.name || "?")[0].toUpperCase();
    const avatarBig = document.getElementById("avatarBig");
    avatarBig.innerHTML = user.photoURL ? `<img src="${user.photoURL}">` : initial;

    document.getElementById("profileName").textContent = user.name || "?";
    document.getElementById("profileUsername").textContent = "@" + (user.username || "?");
    document.getElementById("profileBio").textContent = user.bio || "কোনো পরিচিতি নেই";
    document.getElementById("followerCount").textContent = (user.followers || []).length;
    document.getElementById("followingCount").textContent = (user.following || []).length;

    document.getElementById("aboutUsername").textContent = "@" + (user.username || "?");
    if (user.createdAt) {
      const d = user.createdAt.seconds ? new Date(user.createdAt.seconds * 1000) : new Date(user.createdAt);
      document.getElementById("aboutJoined").textContent = d.toLocaleDateString("bn-BD", {
        day: "numeric", month: "long", year: "numeric"
      });
    }
  }

  async function loadPosts(uid) {
    const grid = document.getElementById("postsGrid");
    try {
      userPosts = await loadUserPosts(uid);
      document.getElementById("postCount").textContent = userPosts.length;

      if (userPosts.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
          এখনো কোনো পোস্ট নেই<br>
          <a href="upload.html" style="color:var(--accent);font-weight:600;display:inline-block;margin-top:12px">+ প্রথম পোস্ট লিখুন</a>
        </div>`;
        return;
      }

      grid.innerHTML = userPosts.map(p => {
        const likes = p.likes?.length || 0;
        const comments = p.commentCount || 0;
        const isLiked = p.likes?.includes(currentUser.uid);
        return `
          <div class="grid-item" data-id="${p.id}">
            <img src="${p.imageUrl}" alt="post" loading="lazy">
            <div class="overlay">
              <span class="${isLiked ? "liked" : ""}">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                ${likes}
              </span>
              <span>
                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                ${comments}
              </span>
            </div>
          </div>
        `;
      }).join("");

      grid.querySelectorAll(".grid-item").forEach(item => {
        item.addEventListener("click", () => {
          const post = userPosts.find(p => p.id === item.dataset.id);
          if (post) openModal(post);
        });
      });
    } catch (e) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">❌ ${e.message}</div>`;
      console.error(e);
    }
  }

  // ==========================================
  // Post detail modal
  // ==========================================
  async function openModal(post) {
    const modal = document.getElementById("postModal");
    const content = document.getElementById("modalContent");

    const initial = (currentUser.name || "?")[0].toUpperCase();
    const isLiked = post.likes?.includes(currentUser.uid);
    const likes = post.likes?.length || 0;
    const time = post.createdAt?.seconds ? timeAgo(post.createdAt.seconds * 1000) : "এইমাত্র";

    // Load comments
    let commentsHTML = "";
    try {
      const comments = await loadComments(post.id);
      if (comments.length === 0) {
        commentsHTML = `<div style="color:var(--ink-mute);font-size:12.5px;font-style:italic;padding:8px 0">এখনো কোনো মন্তব্য নেই</div>`;
      } else {
        commentsHTML = comments.slice(0, 5).map(c =>
          `<div style="font-size:13px;color:var(--ink-soft);line-height:1.6;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--rule)">
            <b style="font-family:'Playfair Display',serif;color:var(--ink)">@${escapeHtml(c.username)}</b> ${escapeHtml(c.text)}
          </div>`
        ).join("");
        if (comments.length > 5) {
          commentsHTML += `<div style="font-size:11.5px;color:var(--ink-mute);font-style:italic;margin-top:6px">আরও ${comments.length - 5} টি মন্তব্য...</div>`;
        }
      }
    } catch (e) {
      commentsHTML = `<div style="color:#c62828;font-size:12px">মন্তব্য লোড ব্যর্থ</div>`;
    }

    content.innerHTML = `
      <div class="modal-image">
        <img src="${post.imageUrl}" alt="post">
      </div>
      <div class="modal-body">
        <div class="modal-author">
          <div class="modal-avatar">${currentUser.photoURL ? `<img src="${currentUser.photoURL}">` : initial}</div>
          <div class="modal-author-info">
            <div class="modal-author-name">${escapeHtml(currentUser.name)}</div>
            <div class="modal-author-handle">@${escapeHtml(currentUser.username)}</div>
          </div>
          <div class="modal-time">${time}</div>
        </div>

        ${post.caption ? `
          <div class="modal-caption">
            <b>${escapeHtml(currentUser.username)}:</b> ${escapeHtml(post.caption)}
          </div>
        ` : ""}

        <div class="modal-stats">
          <div class="modal-stat ${isLiked ? "liked" : ""}" id="modalLike">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="modalLikeCount">${likes}</span>
          </div>
          <div class="modal-stat">
            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>${post.commentCount || 0}</span>
          </div>
        </div>

        <div style="padding-top:14px;border-top:1px solid var(--rule);margin-bottom:16px">
          <div style="font-size:11px;color:var(--ink-mute);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-bottom:10px">মন্তব্যসমূহ</div>
          ${commentsHTML}
        </div>

        <div class="modal-actions">
          <button id="modalLikeBtn">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            ${isLiked ? "পছন্দ হয়েছে" : "পছন্দ"}
          </button>
          <button class="danger" id="modalDeleteBtn">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
            মুছুন
          </button>
        </div>
      </div>
    `;

    modal.classList.add("show");

    document.getElementById("modalClose").addEventListener("click", closeModal);

    // Like
    document.getElementById("modalLikeBtn").addEventListener("click", async () => {
      try {
        const nowLiked = await toggleLike(post.id, post.likes || []);
        post.likes = nowLiked
          ? [...(post.likes || []), currentUser.uid]
          : (post.likes || []).filter(u => u !== currentUser.uid);
        const statEl = document.getElementById("modalLike");
        const countEl = document.getElementById("modalLikeCount");
        statEl.classList.toggle("liked", nowLiked);
        countEl.textContent = post.likes.length;
        document.getElementById("modalLikeBtn").innerHTML = `
          <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          ${nowLiked ? "পছন্দ হয়েছে" : "পছন্দ"}
        `;
        // Update grid overlay
        const gridItem = document.querySelector(`.grid-item[data-id="${post.id}"]`);
        if (gridItem) {
          const overlay = gridItem.querySelector(".overlay");
          if (overlay) {
            const firstSpan = overlay.querySelector("span");
            if (firstSpan) {
              firstSpan.classList.toggle("liked", nowLiked);
              const svg = firstSpan.querySelector("svg");
              firstSpan.innerHTML = "";
              firstSpan.appendChild(svg);
              firstSpan.appendChild(document.createTextNode(" " + post.likes.length));
            }
          }
        }
      } catch (e) { showToast("❌ " + e.message, "err"); }
    });

    // Delete
    document.getElementById("modalDeleteBtn").addEventListener("click", async () => {
      closeModal();
      const ok = await showConfirm("এই পোস্টটি মুছে ফেলবেন?", {
        title: "পোস্ট মুছুন", okText: "মুছে ফেলুন", cancelText: "বাতিল"
      });
      if (!ok) return;
      try {
        await deletePost(post.id);
        userPosts = userPosts.filter(x => x.id !== post.id);
        const gridItem = document.querySelector(`.grid-item[data-id="${post.id}"]`);
        if (gridItem) gridItem.remove();
        document.getElementById("postCount").textContent = userPosts.length;
        showToast("পোস্ট মুছে ফেলা হয়েছে", "ok");
      } catch (e) { showToast("❌ " + e.message, "err"); }
    });
  }

  function closeModal() {
    document.getElementById("postModal").classList.remove("show");
  }

  document.getElementById("postModal").addEventListener("click", (e) => {
    if (e.target.id === "postModal") closeModal();
  });

  // ==========================================
  // Edit profile
  // ==========================================
  document.getElementById("editBtn").addEventListener("click", () => {
    window.location.href = "settings.html";
  });

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    const ok = await showConfirm("প্রস্থান করবেন?", {
      title: "প্রস্থান", okText: "প্রস্থান", cancelText: "বাতিল"
    });
    if (!ok) return;
    await logout();
    window.location.href = "login.html";
  });

  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      const which = tab.dataset.tab;
      document.getElementById("tabPosts").style.display = which === "posts" ? "block" : "none";
      document.getElementById("tabAbout").style.display = which === "about" ? "block" : "none";
    });
  });

  function timeAgo(t) {
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff} সেকেন্ড আগে`;
    if (diff < 3600) return `${Math.floor(diff / 60)} মিনিট আগে`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} ঘণ্টা আগে`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} দিন আগে`;
    return new Date(t).toLocaleDateString("bn-BD");
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
