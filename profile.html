<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Profile</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding-bottom: 70px;
    }
    .topbar {
      background: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
    }
    .topbar h1 { color: #e1306c; margin: 0; font-size: 22px; }
    .topbar a { color: #e1306c; text-decoration: none; font-weight: bold; font-size: 14px; margin-left: 12px; }
    .profile {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px 16px;
    }
    .profile-head {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .avatar-big {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #feda75, #d62976);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 36px;
      font-weight: bold;
      overflow: hidden;
      flex-shrink: 0;
    }
    .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .stats { display: flex; gap: 20px; margin-top: 6px; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: #888; font-size: 13px; }
    .name { font-size: 18px; font-weight: bold; }
    .username { color: #666; font-size: 14px; }
    .bio { font-size: 14px; color: #333; margin: 12px 0; }
    .edit-btn {
      width: 100%;
      background: #efefef;
      color: #333;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      margin-top: 20px;
    }
    .grid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      background: #eee;
    }
    .empty {
      text-align: center;
      color: #999;
      padding: 40px;
      grid-column: 1 / -1;
    }
    .fab {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #e1306c;
      color: white;
      border: none;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      font-size: 28px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(225,48,108,0.4);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Profile</h1>
    <div>
      <a href="index.html">Feed</a>
      <a href="#" id="logoutLink">Logout</a>
    </div>
  </div>

  <div class="profile" id="profile">
    <div id="loading" style="text-align:center;padding:40px;color:#999;">Loading...</div>
  </div>

  <a href="upload.html" class="fab">+</a>

  <script type="module">
    import { requireAuth, logout, getCurrentUser, updateUserData } from "./js/auth.js";
    import { loadUserPosts, deletePost } from "./js/feed.js";

    requireAuth(async (user) => {
      renderProfile(user);
    });

    document.getElementById("logoutLink").addEventListener("click", async (e) => {
      e.preventDefault();
      await logout();
      window.location.href = "login.html";
    });

    async function renderProfile(user) {
      const container = document.getElementById("profile");
      const initial = (user.name || "?")[0].toUpperCase();

      container.innerHTML = `
        <div class="profile-head">
          <div class="avatar-big">${user.photoURL ? `<img src="${user.photoURL}">` : initial}</div>
          <div style="flex:1;">
            <div class="name">${escapeHtml(user.name)}</div>
            <div class="username">@${escapeHtml(user.username)}</div>
            <div class="stats">
              <div class="stat"><b id="postCount">0</b><span>Post</span></div>
              <div class="stat"><b>${(user.followers||[]).length}</b><span>Follower</span></div>
              <div class="stat"><b>${(user.following||[]).length}</b><span>Following</span></div>
            </div>
          </div>
        </div>
        <div class="bio">${escapeHtml(user.bio || "Kono bio nei")}</div>
        <button class="edit-btn" id="editBtn">Profile Edit koro</button>
        <div class="grid" id="grid"></div>
      `;

      document.getElementById("editBtn").addEventListener("click", editProfile);

      // Post load
      try {
        const posts = await loadUserPosts(user.uid);
        document.getElementById("postCount").textContent = posts.length;

        const grid = document.getElementById("grid");
        if (posts.length === 0) {
          grid.innerHTML = `<div class="empty">Kono post nei</div>`;
        } else {
          grid.innerHTML = posts.map(p =>
            `<img src="${p.imageUrl}" alt="post" data-id="${p.id}">`
          ).join("");

          // Click e delete option
          grid.querySelectorAll("img").forEach(img => {
            img.addEventListener("click", async () => {
              if (!confirm("Ei post delete korbe?")) return;
              try {
                await deletePost(img.dataset.id);
                img.remove();
                const c = document.getElementById("postCount");
                c.textContent = Math.max(0, parseInt(c.textContent) - 1);
              } catch (e) {
                alert("Delete fail: " + e.message);
              }
            });
          });
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function editProfile() {
      const user = getCurrentUser();
      const name = prompt("Notun naam:", user.name);
      if (name === null) return;
      const bio = prompt("Notun bio:", user.bio || "");
      if (bio === null) return;

      updateUserData(user.uid, { name: name.trim() || user.name, bio: bio.trim() });
      location.reload();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
