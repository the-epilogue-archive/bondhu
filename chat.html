<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — বার্তা</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  html,body{height:100%;overflow:hidden}
  body{padding-bottom:0}

  .chat-layout{
    position:fixed;top:0;left:0;right:0;
    bottom:calc(72px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
    max-width:560px;margin:0 auto;padding:0 12px;
    overflow:hidden;background:var(--paper);
  }

  /* ============ TOPBAR ============ */
  .chat-topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4px;border-bottom:1px solid var(--rule);
    gap:8px;flex-shrink:0;
  }
  .chat-topbar-title{
    display:flex;align-items:center;gap:8px;
    font-family:'Playfair Display',serif;
    font-size:20px;font-weight:800;
    color:var(--ink);letter-spacing:-.5px;
  }
  .count-badge{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;padding:0 7px;
    background:var(--accent);color:var(--accent-text);
    border-radius:20px;font-family:'Hind Siliguri',sans-serif;
    font-size:11px;font-weight:700;
  }
  .chat-topbar-actions{display:flex;gap:6px;align-items:center}

  .new-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:8px 12px;border-radius:20px;
    background:var(--paper-2);color:var(--ink-soft);
    border:1px solid var(--rule);
    font-family:'Hind Siliguri',sans-serif;
    font-size:12px;font-weight:600;
    text-decoration:none;cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .new-btn:hover{
    background:var(--accent-soft);border-color:var(--accent-border);
    color:var(--accent);transform:translateY(-2px);
  }
  .new-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .home-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:8px 12px;border-radius:20px;
    background:var(--accent);color:var(--accent-text);
    font-family:'Hind Siliguri',sans-serif;
    font-size:12.5px;font-weight:600;text-decoration:none;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    border:none;cursor:pointer;
  }
  .home-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--accent-glow)}
  .home-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ============ CHAT LIST ============ */
  .chat-list{
    flex:1;overflow-y:auto;
    padding:8px 0 20px;scrollbar-width:thin;
  }
  .chat-list::-webkit-scrollbar{width:4px}
  .chat-list::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

  .chat-item{
    display:flex;align-items:center;gap:12px;
    padding:12px;border-radius:14px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    border-bottom:1px solid var(--rule);
  }
  .chat-item:hover{background:var(--accent-soft);transform:translateX(3px)}
  .chat-item:last-child{border-bottom:none}
  .chat-item.active-chat{background:var(--accent-soft)}

  .chat-avatar{
    width:48px;height:48px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:17px;flex-shrink:0;overflow:hidden;
    background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);
    position:relative;
  }
  .chat-avatar img{width:100%;height:100%;object-fit:cover}
  .chat-avatar.group{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .chat-info{flex:1;min-width:0}
  .chat-name{
    font-family:'Playfair Display',serif;
    font-size:15px;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:3px;
    display:flex;align-items:center;gap:6px;
  }
  .group-tag{
    display:inline-flex;align-items:center;
    padding:1px 6px;border-radius:8px;
    background:var(--accent-soft);color:var(--accent);
    font-size:9.5px;font-weight:700;
    font-family:'Hind Siliguri',sans-serif;
    letter-spacing:.3px;flex-shrink:0;
  }
  .chat-preview{
    font-size:12.5px;color:var(--ink-mute);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-time{
    font-size:10px;color:var(--ink-mute);font-style:italic;
    font-family:'Playfair Display',serif;flex-shrink:0;
  }

  /* ============ CONVERSATION ============ */
  .conversation{
    display:none;flex-direction:column;
    flex:1;overflow:hidden;min-height:0;
  }
  .conversation.active{display:flex}

  .conv-header{
    display:flex;align-items:center;gap:8px;
    padding:10px 4px;border-bottom:1px solid var(--rule);
    flex-shrink:0;
  }
  .back-btn{
    display:inline-flex;align-items:center;gap:5px;
    padding:7px 12px 7px 9px;border-radius:22px;
    background:var(--paper-2);border:1px solid var(--rule);
    color:var(--ink-soft);font-family:'Hind Siliguri',sans-serif;
    font-size:12.5px;font-weight:600;cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    flex-shrink:0;
  }
  .back-btn:hover{
    background:var(--accent-soft);border-color:var(--accent-border);
    color:var(--accent);transform:translateX(-3px);
  }
  .back-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

  .conv-user{
    display:flex;align-items:center;gap:10px;flex:1;min-width:0;
    cursor:pointer;padding:4px 6px;border-radius:10px;
    transition:background .2s;
  }
  .conv-user:hover{background:var(--accent-soft)}
  .conv-avatar{
    width:38px;height:38px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:14px;overflow:hidden;flex-shrink:0;
    background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);
  }
  .conv-avatar img{width:100%;height:100%;object-fit:cover}
  .conv-avatar.group{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .conv-info{flex:1;min-width:0}
  .conv-name{
    font-family:'Playfair Display',serif;
    font-size:15px;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .conv-sub{
    font-size:11px;color:var(--ink-mute);
    font-style:italic;font-family:'Playfair Display',serif;
    margin-top:1px;
  }

  .icon-action{
    width:38px;height:38px;flex-shrink:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    color:var(--ink-mute);border:none;background:transparent;cursor:pointer;
  }
  .icon-action:hover{background:var(--accent-soft);color:var(--accent);transform:translateY(-2px)}
  .icon-action svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

  /* ============ MESSAGES ============ */
  .messages{
    flex:1;overflow-y:auto;
    padding:16px 4px;display:flex;flex-direction:column;
    gap:3px;scrollbar-width:thin;
  }
  .messages::-webkit-scrollbar{width:4px}
  .messages::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}

  .msg-row{
    display:flex;width:100%;padding:1px 0;
    animation:msgIn .25s ease forwards;opacity:0;
  }
  @keyframes msgIn{to{opacity:1}}
  .msg-row.me{justify-content:flex-end}
  .msg-row.them{justify-content:flex-start}

  .msg-wrap{
    display:flex;flex-direction:column;
    max-width:78%;gap:2px;
  }
  .msg-row.me .msg-wrap{align-items:flex-end}
  .msg-row.them .msg-wrap{align-items:flex-start}

  .msg-sender{
    font-size:11px;font-weight:700;color:var(--accent);
    font-family:'Playfair Display',serif;
    padding:2px 8px 2px;letter-spacing:.2px;
  }

  .msg{
    padding:9px 14px;border-radius:18px;
    font-size:14px;line-height:1.5;
    font-family:'Hind Siliguri',sans-serif;
    word-wrap:break-word;overflow-wrap:break-word;
    white-space:pre-wrap;cursor:pointer;
    transition:transform .15s,box-shadow .2s;
    position:relative;max-width:100%;box-sizing:border-box;
  }
  .msg:active{transform:scale(.97)}
  .msg:hover{box-shadow:0 2px 8px rgba(0,0,0,.08)}

  .msg.me{
    background:var(--accent);color:var(--accent-text);
    border-bottom-right-radius:5px;
  }
  .msg.them{
    background:var(--paper-2);color:var(--ink);
    border:1px solid var(--rule);border-bottom-left-radius:5px;
  }

  .msg-meta{
    font-size:10px;color:var(--ink-mute);
    font-style:italic;font-family:'Playfair Display',serif;
    padding:0 6px;
  }

  .msg-reply-quote{
    padding:6px 10px;margin-bottom:6px;
    border-left:3px solid rgba(255,255,255,.5);
    background:rgba(0,0,0,.08);border-radius:6px;
    font-size:11.5px;line-height:1.4;
  }
  .msg.them .msg-reply-quote{
    border-left-color:var(--accent);background:rgba(0,0,0,.04);
  }
  .msg-reply-quote .name{
    font-weight:700;font-family:'Playfair Display',serif;
    display:block;margin-bottom:2px;opacity:.85;
  }

  .msg-voice{
    display:flex;align-items:center;gap:10px;
    min-width:200px;padding:2px 0;
  }
  .voice-play{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;cursor:pointer;transition:all .2s;
    border:none;color:inherit;
  }
  .msg.them .voice-play{background:rgba(0,0,0,.1)}
  .voice-play:hover{transform:scale(1.08)}
  .voice-play svg{width:14px;height:14px;fill:currentColor;stroke:none;display:block}
  .voice-bars{
    display:flex;align-items:center;gap:2px;
    flex:1;height:22px;
  }
  .voice-bar{
    flex:1;background:currentColor;border-radius:2px;
    opacity:.5;transition:opacity .15s;min-height:4px;
  }
  .voice-bar.played{opacity:1}
  .voice-duration{
    font-size:11px;font-weight:600;
    font-family:'Playfair Display',serif;
    opacity:.85;min-width:32px;text-align:right;
  }

  /* ============ MESSAGE MENU ============ */
  .msg-menu-backdrop{
    position:fixed;inset:0;background:transparent;
    z-index:99;display:none;
  }
  .msg-menu-backdrop.show{display:block}

  .msg-menu{
    position:fixed;background:var(--paper-elev);
    border:1px solid var(--rule);border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    padding:6px;z-index:100;display:none;min-width:210px;
    animation:menuIn .18s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes menuIn{
    from{opacity:0;transform:scale(.9) translateY(-4px)}
    to{opacity:1;transform:scale(1) translateY(0)}
  }
  .msg-menu.show{display:block}
  .msg-menu button{
    width:100%;padding:11px 14px;border:none;background:transparent;
    color:var(--ink);font-family:'Hind Siliguri',sans-serif;
    font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:11px;
    cursor:pointer;border-radius:9px;text-align:left;
    transition:background .15s,color .15s;
  }
  .msg-menu button:hover{background:var(--accent-soft);color:var(--accent)}
  .msg-menu button.danger{color:#c62828}
  .msg-menu button.danger:hover{background:rgba(198,40,40,.1)}
  .msg-menu button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  .reply-preview{
    display:none;padding:8px 14px;
    background:var(--paper-2);border:1px solid var(--rule);
    border-left:3px solid var(--accent);border-radius:10px;
    margin-bottom:8px;align-items:center;gap:10px;
  }
  .reply-preview.show{display:flex}
  .reply-preview-body{flex:1;min-width:0}
  .reply-preview-name{
    font-size:11px;font-weight:700;
    font-family:'Playfair Display',serif;
    color:var(--accent);margin-bottom:2px;
  }
  .reply-preview-text{
    font-size:12.5px;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .reply-preview-close{
    width:26px;height:26px;border-radius:50%;
    border:none;background:transparent;color:var(--ink-mute);
    cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .reply-preview-close:hover{background:rgba(198,40,40,.1);color:#c62828}
  .reply-preview-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

  /* ============ INPUT ============ */
  .input-wrap{
    flex-shrink:0;padding:10px 0 12px;
    border-top:1px solid var(--rule);background:var(--paper);
  }
  .input-bar{display:flex;gap:6px;align-items:center;position:relative}
  .msg-input{
    flex:1;padding:11px 16px;
    border:1px solid var(--rule);border-radius:24px;
    background:var(--paper-elev);color:var(--ink);
    font-size:14px;font-family:inherit;
    outline:none;min-width:0;
    transition:border-color .25s,box-shadow .25s;
  }
  .msg-input:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
  }
  .send-btn{
    width:42px;height:42px;border-radius:50%;
    background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;border:none;cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .send-btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--accent-glow)}
  .send-btn:active{transform:scale(.94)}
  .send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .send-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .emoji-picker{
    position:absolute;bottom:calc(100% + 8px);left:0;
    background:var(--paper-elev);border:1px solid var(--rule);
    border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);
    width:320px;max-width:calc(100vw - 32px);
    max-height:320px;display:none;flex-direction:column;
    z-index:80;overflow:hidden;
  }
  .emoji-picker.show{display:flex}
  .emoji-tabs{
    display:flex;gap:2px;padding:8px 8px 0;
    border-bottom:1px solid var(--rule);
    overflow-x:auto;scrollbar-width:none;flex-shrink:0;
  }
  .emoji-tabs::-webkit-scrollbar{display:none}
  .emoji-tab{
    padding:8px 10px;border:none;background:transparent;
    font-size:18px;cursor:pointer;border-radius:8px;
    flex-shrink:0;line-height:1;
  }
  .emoji-tab:hover{background:var(--accent-soft)}
  .emoji-tab.active{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
  .emoji-grid{
    display:grid;grid-template-columns:repeat(8,1fr);
    gap:2px;padding:8px;overflow-y:auto;flex:1;
  }
  .emoji-grid button{
    font-size:22px;padding:4px;border:none;
    background:transparent;border-radius:6px;
    cursor:pointer;line-height:1;aspect-ratio:1;
  }
  .emoji-grid button:hover{background:var(--accent-soft);transform:scale(1.2)}

  .recording-bar{
    display:none;align-items:center;gap:12px;flex:1;
    padding:11px 16px;border:1px solid #c62828;border-radius:24px;
    background:rgba(198,40,40,.08);color:#c62828;
    font-size:13px;font-weight:600;
  }
  .recording-bar.show{display:flex}
  .recording-dot{
    width:10px;height:10px;border-radius:50%;
    background:#c62828;animation:pulse .8s infinite;flex-shrink:0;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .recording-time{
    font-family:'Playfair Display',serif;
    font-weight:700;font-size:14px;min-width:44px;margin-left:auto;
  }
  .recording-cancel{
    padding:4px 10px;border-radius:14px;
    background:transparent;border:1px solid #c62828;
    color:#c62828;font-size:11.5px;font-weight:700;
    cursor:pointer;font-family:inherit;
  }

  .chat-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:60px 20px;gap:16px;color:var(--ink-mute);text-align:center;
  }
  .chat-empty svg{width:56px;height:56px;stroke:var(--rule-dark);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .chat-empty a{color:var(--accent);font-weight:600;padding:10px 20px;border-radius:24px;background:var(--accent-soft);text-decoration:none}

  @media (max-width:480px){
    .emoji-picker{width:calc(100vw - 24px);max-height:280px}
    .emoji-grid{grid-template-columns:repeat(7,1fr)}
  }

  /* ============================================
     CALL UI
     ============================================ */
  .call-overlay{
    position:fixed;inset:0;z-index:500;
    background:linear-gradient(180deg,#0a1628 0%,#0f1e30 100%);
    display:none;
    flex-direction:column;
    color:#fff;
    font-family:'Hind Siliguri',sans-serif;
    opacity:0;
    transition:opacity .3s;
  }
  .call-overlay.show{display:flex;opacity:1}

  /* Incoming */
  .call-incoming{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 24px;text-align:center;
  }
  .call-incoming-avatar{
    width:120px;height:120px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;
    font-size:48px;font-weight:700;
    margin-bottom:24px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(124,179,66,.4);
    animation:callPulse 1.8s infinite;
    position:relative;
  }
  @keyframes callPulse{
    0%,100%{box-shadow:0 20px 60px rgba(124,179,66,.4),0 0 0 0 rgba(124,179,66,.6)}
    50%{box-shadow:0 20px 60px rgba(124,179,66,.4),0 0 0 20px rgba(124,179,66,0)}
  }
  .call-incoming-avatar img{width:100%;height:100%;object-fit:cover}
  .call-incoming-name{
    font-family:'Playfair Display',serif;
    font-size:26px;font-weight:700;margin-bottom:8px;
  }
  .call-incoming-type{
    font-size:14px;opacity:.7;margin-bottom:40px;
    letter-spacing:.5px;
  }
  .call-incoming-actions{display:flex;gap:40px}
  .call-btn-circle{
    width:70px;height:70px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:none;cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .call-btn-circle:hover{transform:scale(1.08)}
  .call-btn-circle:active{transform:scale(.94)}
  .call-btn-circle svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .call-btn-reject{background:#dc2626;color:#fff}
  .call-btn-accept{background:#22c55e;color:#fff;animation:callPulse 1.8s infinite}

  /* Active call */
  .call-active{
    flex:1;position:relative;display:flex;flex-direction:column;
    background:#000;overflow:hidden;
  }
  .call-video-container{
    flex:1;position:relative;background:#000;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .call-remote-video{
    width:100%;height:100%;object-fit:cover;
    background:#000;
  }
  .call-local-video{
    position:absolute;top:80px;right:16px;
    width:110px;height:150px;
    border-radius:14px;object-fit:cover;
    background:#111;border:2px solid rgba(255,255,255,.2);
    z-index:5;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    transform:scaleX(-1);
  }
  .call-audio-only{
    flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px;
    background:linear-gradient(180deg,#0a1628 0%,#0f1e30 100%);
  }
  .call-audio-avatar{
    width:140px;height:140px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;
    font-size:56px;font-weight:700;
    overflow:hidden;
    margin-bottom:24px;
    box-shadow:0 20px 60px rgba(124,179,66,.3);
  }
  .call-audio-avatar img{width:100%;height:100%;object-fit:cover}
  .call-audio-name{
    font-family:'Playfair Display',serif;
    font-size:24px;font-weight:700;margin-bottom:10px;
  }
  .call-status{
    font-size:14px;opacity:.75;letter-spacing:.3px;
  }
  .call-status .dot{
    display:inline-block;
    animation:dotBlink 1.4s infinite;
  }
  .call-status .dot:nth-child(2){animation-delay:.2s}
  .call-status .dot:nth-child(3){animation-delay:.4s}
  @keyframes dotBlink{0%,60%,100%{opacity:.3}30%{opacity:1}}
  .call-timer{
    font-family:'Playfair Display',serif;
    font-size:16px;font-weight:600;
    letter-spacing:1px;margin-top:8px;
  }

  .call-top-bar{
    position:absolute;top:0;left:0;right:0;
    padding:20px 20px 40px;
    background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);
    z-index:4;
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .call-top-info{color:#fff}
  .call-top-name{
    font-family:'Playfair Display',serif;
    font-size:18px;font-weight:700;
  }
  .call-top-type{font-size:12px;opacity:.7;margin-top:2px}

  .call-controls{
    position:absolute;bottom:0;left:0;right:0;
    padding:30px 20px 50px;
    background:linear-gradient(0deg,rgba(0,0,0,.85),transparent);
    z-index:4;
    display:flex;justify-content:center;gap:20px;
  }
  .call-ctrl{
    width:60px;height:60px;border-radius:50%;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    color:#fff;cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .call-ctrl:hover{transform:scale(1.1);background:rgba(255,255,255,.25)}
  .call-ctrl:active{transform:scale(.94)}
  .call-ctrl.off{background:#fff;color:#000}
  .call-ctrl.end{background:#dc2626;border-color:#dc2626}
  .call-ctrl.end:hover{background:#b91c1c}
  .call-ctrl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* Desktop 2-col */
  @media (min-width: 900px) {
    body { padding-bottom: 0; overflow: hidden; }
    .bottom-nav { display: none; }
    .chat-layout {
      position: fixed;top:0;left:0;right:0;bottom:0;
      max-width: 1200px;margin: 0 auto;padding: 20px 24px;
      display: grid;grid-template-columns: 340px 1fr;
      grid-template-rows: auto 1fr;gap: 0 20px;
      overflow: hidden;background: var(--paper);
    }
    .chat-topbar {
      grid-column: 1 / -1;padding: 0 4px 14px;
      border-bottom: 1px solid var(--rule);margin-bottom: 20px;
    }
    .chat-list {
      display: block !important;
      background: var(--paper-elev);border: 1px solid var(--rule);
      border-radius: 16px;padding: 12px;overflow-y: auto;height: 100%;
    }
    .conversation {
      display: flex !important;
      background: var(--paper-elev);border: 1px solid var(--rule);
      border-radius: 16px;padding: 0 16px 14px;
      overflow: hidden;height: 100%;position: relative;
    }
    .conversation:not(.active) .conv-header,
    .conversation:not(.active) .messages,
    .conversation:not(.active) .input-wrap {
      display: none !important;
    }
    .conversation:not(.active)::before {
      content: '💬 একটি চ্যাট বেছে নিন';
      position: absolute;top: 50%;left: 50%;
      transform: translate(-50%, -50%);
      color: var(--ink-mute);
      font-family: 'Playfair Display', serif;
      font-style: italic;font-size: 15px;white-space: nowrap;
    }
    .emoji-picker { width: 360px; max-height: 360px; }
    .emoji-grid { grid-template-columns: repeat(9, 1fr); }
  }
</style>

<script type="module">
  import { requireAuth, getAllUsersList } from "./js/auth.js";
  import {
    getOrCreateChat, sendMessage, listenMessages,
    listenMyChats, listenChat, getChatDisplay,
    sendVoiceMessage, deleteForMe, unsendMessage,
    leaveGroup, removeGroupMember
  } from "./js/chat.js";
  import {
    startCall, listenIncomingCalls, acceptCall, rejectCall, endCall,
    toggleMute, toggleVideo, cleanupCall, getLocalStream
  } from "./js/call.js";
  import { showToast, showConfirm } from "./js/toast.js";

  let currentUser = null;
  let activeChatId = null;
  let unsubMessages = null;
  let unsubChat = null;
  let unsubIncoming = null;
  let currentChats = [];
  let currentChat = null;
  let currentDisplay = null;
  let allMessages = [];
  let replyTarget = null;

  let isMuted = false;
  let isVideoOff = false;
  let callTimerInterval = null;
  let callStartTime = 0;

  const $ = (id) => document.getElementById(id);

  const isDesktop = () => window.innerWidth >= 900;

  const EMOJI_DATA = {
    "😊": ["😀","😁","😂","🤣","😊","😍","😘","😎","🤔","😅","😢","😭","😡","🥰","😴","🤗","🙃","😉","😋","🤤","😇","🥳","🤩","😱","🤯","😳","🥺","😤","😈","💀","👻","🤖","😺","😸","😹","😻"],
    "👍": ["👍","👎","👏","🙏","💪","✌️","🤝","👋","🤚","🖐","✋","👌","🤌","🤞","🤟","🤘","👈","👉","👆","👇","☝️","✊","👊","🫶","💅","🤳"],
    "❤️": ["❤️","🧡","💛","💚","💙","💜","🖤","🤍","🤎","💔","❣️","💕","💞","💓","💗","💖","💘","💝","💟","♥️","💌"],
    "🎉": ["🎉","🎊","🎁","🎂","🎈","🎀","🎗","🎃","🎄","🎆","🎇","✨","⭐","🌟","💫","🔥","💯","✅","❌","⚡","🌈","☀️","🌙"],
    "🌹": ["🌸","🌹","🌺","🌻","🌼","🌷","💐","🍀","🌿","🍃","🌱","🌳","🌴","🌵","🌾"],
    "🍕": ["🍕","🍔","🍟","🌭","🥪","🌮","🌯","🥙","🍗","🍖","🍛","🍜","🍝","🍣","🍱","🍚","🍙","🍘","🍥","🥟","🍤","🍢","🍡","🍧","🍨","🍦","🍩","🍪","🍰","🧁","🍫","🍬","🍭","🍮"]
  };

  function renderEmojiTabs() {
    $("emojiTabs").innerHTML = Object.keys(EMOJI_DATA).map((cat, i) =>
      `<button class="emoji-tab ${i === 0 ? "active" : ""}" data-cat="${cat}">${cat}</button>`
    ).join("");
    $("emojiTabs").querySelectorAll(".emoji-tab").forEach(tab => {
      tab.addEventListener("click", (e) => {
        e.stopPropagation();
        $("emojiTabs").querySelectorAll(".emoji-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        renderEmojiGrid(tab.dataset.cat);
      });
    });
  }
  function renderEmojiGrid(cat) {
    const emojis = EMOJI_DATA[cat] || [];
    $("emojiGrid").innerHTML = emojis.map(e => `<button type="button" data-emoji="${e}">${e}</button>`).join("");
    $("emojiGrid").querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => {
        $("msgInput").value += btn.dataset.emoji;
        $("msgInput").focus();
      });
    });
  }
  renderEmojiTabs();
  renderEmojiGrid(Object.keys(EMOJI_DATA)[0]);

  $("emojiBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    $("emojiPicker").classList.toggle("show");
  });
  document.addEventListener("click", (e) => {
    if (!$("emojiPicker").contains(e.target) && e.target !== $("emojiBtn") && !$("emojiBtn").contains(e.target)) {
      $("emojiPicker").classList.remove("show");
    }
  });

  requireAuth(async (user) => {
    currentUser = user;
    const params = new URLSearchParams(window.location.search);
    const toUsername = params.get("to");
    const groupId = params.get("g");

    listenMyChats(user.uid, (chats) => {
      currentChats = chats;
      renderChatList(chats);
    });

    // Listen for incoming calls
    unsubIncoming = listenIncomingCalls(user.uid, (callId, call) => {
      if (document.getElementById("callOverlay").classList.contains("show")) return;
      showIncomingCall(callId, call);
    });

    if (toUsername) await openChatWithUsername(toUsername);
    else if (groupId) openChatById(groupId);
  });

  function renderChatList(chats) {
    if (!chats || chats.length === 0) {
      $("chatCountBadge").style.display = "none";
      $("chatList").innerHTML = `
        <div class="chat-empty">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <div style="line-height:1.6">এখনো কোনো বার্তা নেই<br>কথা শুরু করুন</div>
          <a href="search.html">ব্যবহারকারী খুঁজুন</a>
        </div>`;
      return;
    }
    $("chatCountBadge").textContent = chats.length;
    $("chatCountBadge").style.display = "inline-flex";

    $("chatList").innerHTML = chats.map(chat => {
      const display = getChatDisplay(chat, currentUser.uid);
      const initial = (display.name || "?")[0].toUpperCase();
      const time = chat.updatedAt?.seconds ? timeAgo(chat.updatedAt.seconds * 1000)
                 : (chat.createdAt?.seconds ? timeAgo(chat.createdAt.seconds * 1000) : "");
      const isActive = chat.id === activeChatId;
      let preview = chat.lastMessage || "কথা শুরু করুন";
      if (chat.isGroup && chat.lastSenderName && chat.lastMessage) {
        preview = `${chat.lastSenderName}: ${chat.lastMessage}`;
      }
      return `
        <div class="chat-item ${isActive ? "active-chat" : ""}" data-chat-id="${chat.id}">
          <div class="chat-avatar ${display.isGroup ? "group" : ""}">${display.photoURL ? `<img src="${display.photoURL}">` : initial}</div>
          <div class="chat-info">
            <div class="chat-name">
              ${escapeHtml(display.name)}
              ${display.isGroup ? `<span class="group-tag">গ্রুপ</span>` : ""}
            </div>
            <div class="chat-preview">${escapeHtml(preview)}</div>
          </div>
          <div class="chat-time">${time}</div>
        </div>`;
    }).join("");

    $("chatList").querySelectorAll(".chat-item").forEach(item => {
      item.addEventListener("click", () => openChatById(item.dataset.chatId));
    });
  }

  function openChatById(chatId) {
    activeChatId = chatId;
    replyTarget = null;
    $("replyPreview").classList.remove("show");
    if (!isDesktop()) $("chatList").style.display = "none";
    $("conversation").classList.add("active");

    if (unsubMessages) unsubMessages();
    if (unsubChat) unsubChat();

    unsubMessages = listenMessages(chatId, (msgs) => {
      allMessages = msgs;
      renderMessages(msgs);
    });

    unsubChat = listenChat(chatId, (chat) => {
      if (!chat) return;
      currentChat = chat;
      currentDisplay = getChatDisplay(chat, currentUser.uid);
      renderConvHeader(chat, currentDisplay);
    });

    setTimeout(() => $("msgInput").focus(), 150);
  }

  function renderConvHeader(chat, display) {
    const initial = (display.name || "?")[0].toUpperCase();
    $("convAvatar").className = "conv-avatar" + (display.isGroup ? " group" : "");
    $("convAvatar").innerHTML = display.photoURL ? `<img src="${display.photoURL}">` : initial;
    $("convName").textContent = display.name;
    $("convSub").textContent = display.isGroup
      ? `${bnNum(display.memberCount)} জন সদস্য · ট্যাপ করুন বিস্তারিত`
      : "@" + (display.username || "");

      $("videoCallBtn").style.display = "flex";

  $("convUserBtn").addEventListener("click", () => {
    const isGroup = $("conversation").dataset.isGroup === "1";
    if (isGroup) showGroupInfo();
    else {
      const u = currentDisplay?.username;
      if (u) window.location.href = `user.html?u=${encodeURIComponent(u)}`;
    }
  });

  async function openChatWithUsername(username) {
    try {
      const all = await getAllUsersList();
      const target = all.find(u => (u.username || "").toLowerCase() === username.toLowerCase());
      if (!target) { showToast("ব্যবহারকারী পাওয়া যায়নি", "err"); return; }
      const chatId = await getOrCreateChat(target);
      openChatById(chatId);
    } catch (e) { showToast("চ্যাট খোলা যায়নি: " + e.message, "err"); }
  }

  function renderMessages(msgs) {
    if (msgs.length === 0) {
      $("messages").innerHTML = `<div style="text-align:center;color:var(--ink-mute);font-size:13px;padding:30px 20px;font-style:italic">কথা শুরু করুন 👋</div>`;
      return;
    }
    const isGroup = currentChat?.isGroup;

    $("messages").innerHTML = msgs.map((m, idx) => {
      const isMe = m.from === currentUser.uid;
      const time = m.createdAt?.seconds ? shortTime(m.createdAt.seconds * 1000) : "";
      const prev = msgs[idx - 1];
      const showTime = !prev || (m.createdAt?.seconds && prev.createdAt?.seconds &&
                       (m.createdAt.seconds - prev.createdAt.seconds) > 300);
      const showSender = isGroup && !isMe && (!prev || prev.from !== m.from);

      let inner = "";
      if (m.replyTo) {
        inner += `<div class="msg-reply-quote">
          <span class="name">@${escapeHtml(m.replyTo.username || "?")}</span>
          ${escapeHtml((m.replyTo.text || "").slice(0, 80))}
        </div>`;
      }
      if (m.type === "voice" && m.audioUrl) {
        inner += `<div class="msg-voice" data-audio="${m.audioUrl}" data-duration="${m.duration || 0}">
          <button class="voice-play" type="button"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg></button>
          <div class="voice-bars">${Array.from({length: 24}).map((_, i) =>
            `<div class="voice-bar" style="height:${20 + Math.sin(i * 0.8) * 30 + Math.random() * 30}%"></div>`
          ).join("")}</div>
          <div class="voice-duration">${formatDuration(m.duration || 0)}</div>
        </div>`;
      } else {
        inner += escapeHtml(m.text || "");
      }

      return `
        ${showTime ? `<div style="text-align:center;font-size:10.5px;color:var(--ink-mute);font-style:italic;font-family:'Playfair Display',serif;padding:6px 0">${time}</div>` : ""}
        <div class="msg-row ${isMe ? "me" : "them"}">
          <div class="msg-wrap">
            ${showSender ? `<div class="msg-sender">${escapeHtml(m.fromName || "User")}</div>` : ""}
            <div class="msg ${isMe ? "me" : "them"}" data-id="${m.id}">${inner}</div>
          </div>
        </div>`;
    }).join("");

    $("messages").querySelectorAll(".msg-voice").forEach(el => {
      const audioUrl = el.dataset.audio;
      const btn = el.querySelector(".voice-play");
      const bars = el.querySelectorAll(".voice-bar");
      const durationEl = el.querySelector(".voice-duration");
      const totalDur = parseInt(el.dataset.duration) || 0;
      let audio = null, rafId = null;
      btn.addEventListener("click", () => {
        if (!audio) {
          audio = new Audio(audioUrl);
          audio.addEventListener("loadedmetadata", () => {
            if (audio.duration && isFinite(audio.duration)) durationEl.textContent = formatDuration(audio.duration);
          });
          audio.addEventListener("ended", () => {
            btn.querySelector("svg").innerHTML = '<polygon points="6 4 20 12 6 20"/>';
            bars.forEach(b => b.classList.remove("played"));
            durationEl.textContent = formatDuration(audio.duration || totalDur);
            if (rafId) cancelAnimationFrame(rafId);
          });
        }
        if (audio.paused) {
          audio.play();
          btn.querySelector("svg").innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
          const update = () => {
            if (!audio.duration || !isFinite(audio.duration)) { rafId = requestAnimationFrame(update); return; }
            const pct = audio.currentTime / audio.duration;
            const played = Math.floor(pct * bars.length);
            bars.forEach((b, i) => b.classList.toggle("played", i < played));
            durationEl.textContent = formatDuration(Math.max(0, audio.duration - audio.currentTime));
            if (!audio.paused) rafId = requestAnimationFrame(update);
          };
          update();
        } else {
          audio.pause();
          btn.querySelector("svg").innerHTML = '<polygon points="6 4 20 12 6 20"/>';
          if (rafId) cancelAnimationFrame(rafId);
        }
      });
    });

    $("messages").querySelectorAll(".msg").forEach(el => {
      el.addEventListener("click", (e) => {
        e.stopPropagation();
        const msg = allMessages.find(m => m.id === el.dataset.id);
        if (msg) openMsgMenu(e.clientX, e.clientY, msg);
      });
    });

    $("messages").scrollTop = $("messages").scrollHeight;
  }

  function openMsgMenu(x, y, msg) {
    const isMe = msg.from === currentUser.uid;
    const isVoice = msg.type === "voice";
    $("msgMenu").innerHTML = `
      <button data-action="reply">
        <svg viewBox="0 0 24 24"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
        উত্তর দিন
      </button>
      ${!isVoice ? `<button data-action="copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> কপি করুন</button>` : ""}
      <button data-action="delete-me" class="danger">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/></svg>
        শুধু আমার জন্য মুছুন
      </button>
      ${isMe ? `<button data-action="unsend" class="danger"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg> সবার থেকে মুছুন (Unsend)</button>` : ""}
    `;
    $("msgMenuBackdrop").classList.add("show");
    $("msgMenu").classList.add("show");
    const rect = $("msgMenu").getBoundingClientRect();
    let left = x, top = y;
    if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
    if (top + rect.height > window.innerHeight - 10) top = window.innerHeight - rect.height - 10;
    if (left < 10) left = 10;
    if (top < 10) top = 10;
    $("msgMenu").style.left = left + "px";
    $("msgMenu").style.top = top + "px";

    $("msgMenu").querySelectorAll("button").forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;
        closeMsgMenu();
        if (action === "reply") setReplyTarget(msg);
        else if (action === "copy") {
          try { await navigator.clipboard.writeText(msg.text || ""); showToast("কপি হয়েছে", "ok"); }
          catch (e) { showToast("কপি ব্যর্থ", "err"); }
        } else if (action === "delete-me") {
          const ok = await showConfirm("শুধু আপনার কাছ থেকে এই বার্তাটি মুছে যাবে।",
            { title: "শুধু আমার জন্য", okText: "মুছে ফেলুন" });
          if (!ok) return;
          try { await deleteForMe(activeChatId, msg.id); showToast("✅ মুছে ফেলা হয়েছে", "ok"); }
          catch (e) { showToast("❌ " + e.message, "err"); }
        } else if (action === "unsend") {
          const ok = await showConfirm("সবার কাছ থেকে এই বার্তাটি মুছে যাবে।",
            { title: "সবার থেকে মুছুন", okText: "Unsend" });
          if (!ok) return;
          try { await unsendMessage(activeChatId, msg.id); showToast("✅ সবাই থেকে মুছে ফেলা হয়েছে", "ok"); }
          catch (e) { showToast("❌ " + e.message, "err"); }
        }
      };
    });
  }

  function closeMsgMenu() {
    $("msgMenu").classList.remove("show");
    $("msgMenuBackdrop").classList.remove("show");
  }
  $("msgMenuBackdrop").addEventListener("click", closeMsgMenu);
  document.addEventListener("click", (e) => {
    if (!$("msgMenu").contains(e.target) && !$("msgMenuBackdrop").contains(e.target)) closeMsgMenu();
  });
  $("messages").addEventListener("scroll", closeMsgMenu);

  function setReplyTarget(msg) {
    replyTarget = {
      id: msg.id,
      text: msg.type === "voice" ? "🎤 ভয়েস বার্তা" : (msg.text || ""),
      from: msg.from,
      username: msg.from === currentUser.uid ? (currentUser.username || "আমি") : (msg.fromUsername || "?")
    };
    $("replyName").textContent = "@" + replyTarget.username;
    $("replyText").textContent = replyTarget.text;
    $("replyPreview").classList.add("show");
    $("msgInput").focus();
  }
  $("replyClose").addEventListener("click", () => {
    replyTarget = null;
    $("replyPreview").classList.remove("show");
  });

  async function doSend() {
    const text = $("msgInput").value.trim();
    if (!text || !activeChatId) return;
    $("sendBtn").disabled = true;
    $("msgInput").value = "";
    const reply = replyTarget;
    replyTarget = null;
    $("replyPreview").classList.remove("show");
    try { await sendMessage(activeChatId, text, reply); }
    catch (e) { $("msgInput").value = text; showToast("পাঠানো যায়নি: " + e.message, "err"); }
    $("sendBtn").disabled = false;
    $("msgInput").focus();
  }
  $("sendBtn").addEventListener("click", doSend);
  $("msgInput").addEventListener("keydown", e => { if (e.key === "Enter") doSend(); });

  $("backBtn").addEventListener("click", () => {
    activeChatId = null;
    currentChat = null;
    currentDisplay = null;
    replyTarget = null;
    $("replyPreview").classList.remove("show");
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    if (unsubChat) { unsubChat(); unsubChat = null; }
    $("conversation").classList.remove("active");
    $("chatList").style.display = "block";
    if (window.history && window.history.replaceState) {
      window.history.replaceState({}, "", "chat.html");
    }
  });

  // GROUP INFO

    const myUid = currentUser.uid;

    const modal = document.createElement("div");
    modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200";

            ${currentChat.photoURL ? `<img src="${currentChat.photoURL}" style="width:100%;height:100%;object-fit:cover">` : (currentChat.name || "?")[0].toUpperCase()}

  // ==========================================
  // CALL SYSTEM
  // ==========================================
  function showCallOverlay() {
    $("callOverlay").classList.add("show");
  }
  function hideCallOverlay() {
    $("callOverlay").classList.remove("show");
    $("callIncoming").style.display = "none";
    $("callActive").style.display = "none";
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = null;
  }

  // Start call (from chat header buttons)
  async function initiateCall(type) {
    if (!currentDisplay || currentDisplay.isGroup) {
      showToast("গ্রুপ কল শীঘ্রই আসছে", "info");
      return;
    }
    if (!currentDisplay.uid) {
      showToast("ইউজার আইডি পাওয়া যায়নি", "err");
      return;
    }

    showCallOverlay();
    $("callIncoming").style.display = "none";
    $("callActive").style.display = "flex";
    showActiveCallUI(currentDisplay, type, "কল যাচ্ছে...");

    try {
      await startCall(currentDisplay.uid, type, {
        onRemoteStream: (stream) => {
          const remoteVideo = $("remoteVideo");
          remoteVideo.srcObject = stream;
          remoteVideo.play().catch(() => {});
          if (type === "voice") {
            $("callStatus").innerHTML = "সংযুক্ত";
            if (!callTimerInterval) startCallTimer();
          } else {
            if (!callTimerInterval) startCallTimer();
          }
        },
        onICEConnectionChange: (state) => {
          if (state === "connected") {
            $("callStatus").innerHTML = "সংযুক্ত";
          }
        },
        onEnded: () => {
          showToast("কল শেষ হয়েছে", "info");
          hideCallOverlay();
        },
        onError: (e) => {
          showToast("কল ব্যর্থ: " + e.message, "err");
          hideCallOverlay();
        }
      });

      // Local video
      const localStream = getLocalStream();
      if (localStream) {
        $("localVideo").srcObject = localStream;
        $("localVideo").play().catch(() => {});
        if (type === "voice") {
          $("localVideo").style.display = "none";
        }
      }
    } catch (e) {
      showToast("কল শুরু করা যায়নি: " + e.message, "err");
      hideCallOverlay();
    }
  }

  function showActiveCallUI(display, type, statusText) {
    const initial = (display.name || "?")[0].toUpperCase();
    $("activeCallName").textContent = display.name;
    $("activeCallType").textContent = type === "video" ? "ভিডিও কল" : "ভয়েস কল";

    $("activeAudioAvatar").innerHTML = display.photoURL ? `<img src="${display.photoURL}">` : initial;
    $("activeAudioName").textContent = display.name;
    $("callStatus").innerHTML = statusText === "সংযুক্ত" ? "সংযুক্ত" : `<span class="dot">●</span> <span class="dot">●</span> <span class="dot">●</span>`;

    if (type === "video") {
      $("callVideoContainer").style.display = "flex";
      $("callAudioOnly").style.display = "none";
      $("videoToggleBtn").style.display = "flex";
    } else {
      $("callVideoContainer").style.display = "none";
      $("callAudioOnly").style.display = "flex";
      $("videoToggleBtn").style.display = "none";
    }
  }

  function startCallTimer() {
    callStartTime = Date.now();
    $("callTimer").style.display = "block";
    callTimerInterval = setInterval(() => {
      const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
      const m = Math.floor(elapsed / 60);
      const s = elapsed % 60;
      $("callTimer").textContent = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }, 1000);
  }

  // Listen for incoming
  function showIncomingCall(callId, call) {
    showCallOverlay();
    $("callIncoming").style.display = "flex";
    $("callActive").style.display = "none";

    const initial = (call.callerName || "?")[0].toUpperCase();
    $("incomingAvatar").innerHTML = initial;
    $("incomingName").textContent = call.callerName || "Unknown";
    $("incomingType").textContent = call.type === "video" ? "ভিডিও কল আসছে..." : "ভয়েস কল আসছে...";

    // Accept
    $("acceptBtn").onclick = async () => {
      try {
        $("callIncoming").style.display = "none";
        $("callActive").style.display = "flex";

        const display = { name: call.callerName || "Unknown", photoURL: "", uid: call.callerId };
        showActiveCallUI(display, call.type, "সংযুক্ত হচ্ছে...");

        await acceptCall(callId, {
          onRemoteStream: (stream) => {
            $("remoteVideo").srcObject = stream;
            $("remoteVideo").play().catch(() => {});
            $("callStatus").innerHTML = "সংযুক্ত";
            if (!callTimerInterval) startCallTimer();
          },
          onICEConnectionChange: (state) => {
            if (state === "connected") $("callStatus").innerHTML = "সংযুক্ত";
          },
          onEnded: () => {
            showToast("কল শেষ হয়েছে", "info");
            hideCallOverlay();
          },
          onError: (e) => {
            showToast("কল ব্যর্থ: " + e.message, "err");
            hideCallOverlay();
          }
        });

        const localStream = getLocalStream();
        if (localStream) {
          $("localVideo").srcObject = localStream;
          $("localVideo").play().catch(() => {});
          if (call.type === "voice") $("localVideo").style.display = "none";
        }
      } catch (e) {
        showToast("কল গ্রহণ ব্যর্থ: " + e.message, "err");
        hideCallOverlay();
      }
    };

    // Reject
    $("rejectBtn").onclick = async () => {
      await rejectCall(callId);
      hideCallOverlay();
    };
  }

  // Control buttons
  $("muteBtn").addEventListener("click", () => {
    isMuted = toggleMute();
    $("muteBtn").classList.toggle("off", isMuted);
    showToast(isMuted ? "🔇 মিউট" : "🔊 আনমিউট", "info");
  });

  $("videoToggleBtn").addEventListener("click", () => {
    isVideoOff = toggleVideo();
    $("videoToggleBtn").classList.toggle("off", isVideoOff);
    $("localVideo").style.opacity = isVideoOff ? "0.3" : "1";
    showToast(isVideoOff ? "📹 ভিডিও বন্ধ" : "📹 ভিডিও চালু", "info");
  });

  $("endCallBtn").addEventListener("click", async () => {
    await endCall();
    hideCallOverlay();
  });

  $("voiceCallBtn").addEventListener("click", () => initiateCall("voice"));
  $("videoCallBtn").addEventListener("click", () => initiateCall("video"));

  // Cleanup on page leave
  window.addEventListener("beforeunload", () => {
    cleanupCall();
    if (unsubIncoming) unsubIncoming();
  });

  // Voice message recording
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;
  let recordStartTime = 0;
  let recordTimerInterval = null;
  let recordedDuration = 0;

  $("voiceBtn").addEventListener("click", async () => {
    if (!activeChatId) { showToast("প্রথমে একটি চ্যাট খুলুন", "err"); return; }
    if (isRecording) return;
    await startRecording();
  });
  $("voiceSendBtn").addEventListener("click", () => { if (isRecording && mediaRecorder) mediaRecorder.stop(); });
  $("recordingCancel").addEventListener("click", () => {
    if (isRecording && mediaRecorder) {
      mediaRecorder.onstop = null;
      mediaRecorder.stop();
      mediaRecorder.stream?.getTracks().forEach(t => t.stop());
      isRecording = false;
      $("inputBar").style.display = "flex";
      $("recordingBar").style.display = "none";
      clearInterval(recordTimerInterval);
      showToast("রেকর্ডিং বাতিল", "info");
    }
  });

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.addEventListener("dataavailable", e => { if (e.data.size > 0) audioChunks.push(e.data); });
      mediaRecorder.addEventListener("stop", async () => {
        stream.getTracks().forEach(t => t.stop());
        isRecording = false;
        $("inputBar").style.display = "flex";
        $("recordingBar").style.display = "none";
        clearInterval(recordTimerInterval);
        if (audioChunks.length === 0) return;
        const blob = new Blob(audioChunks, { type: "audio/webm" });
        if (blob.size < 1000) return;
        const tempDiv = document.createElement("div");
        tempDiv.className = "msg-row me";
        tempDiv.innerHTML = `<div class="msg-wrap"><div class="msg me">
          <div class="msg-voice">
            <button class="voice-play"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg></button>
            <div class="voice-bars">${Array.from({length: 24}).map((_, i) =>
              `<div class="voice-bar" style="height:${20 + Math.sin(i * 0.8) * 30 + Math.random() * 30}%"></div>`
            ).join("")}</div>
            <div class="voice-duration">আপলোড...</div>
          </div>
        </div></div>`;
        $("messages").appendChild(tempDiv);
        $("messages").scrollTop = $("messages").scrollHeight;
        try {
          await sendVoiceMessage(activeChatId, blob, recordedDuration, (pct) => {
            const el = tempDiv.querySelector(".voice-duration");
            if (el) el.textContent = pct + "%";
          });
          tempDiv.remove();
        } catch (err) { tempDiv.remove(); showToast("ভয়েস পাঠানো যায়নি: " + err.message, "err"); }
      });
      mediaRecorder.start();
      isRecording = true;
      recordStartTime = Date.now();
      recordedDuration = 0;
      $("inputBar").style.display = "none";
      $("recordingBar").style.display = "flex";
      $("recordingTime").textContent = "0:00";
      recordTimerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - recordStartTime) / 1000);
        recordedDuration = elapsed;
        const m = Math.floor(elapsed / 60);
        const s = elapsed % 60;
        $("recordingTime").textContent = m + ":" + (s < 10 ? "0" : "") + s;
        if (elapsed >= 60) mediaRecorder.stop();
      }, 250);
    } catch (e) { showToast("মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি", "err"); }
  }

  function formatDuration(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  function shortTime(t) {
    const d = new Date(t);
    const h = d.getHours();
    const m = d.getMinutes();
    const ampm = h >= 12 ? "PM" : "AM";
    const hh = h % 12 || 12;
    return `${hh}:${m < 10 ? "0" : ""}${m} ${ampm}`;
  }
  function timeAgo(t) {
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff}s`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
    return `${Math.floor(diff / 86400)}d`;
  }
  function bnNum(n) {
    const en = "0123456789", bn = "০১২৩৪৫৬৭৮৯";
    return String(n).replace(/[0-9]/g, d => bn[en.indexOf(d)]);
  }
  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
