<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #feda75, #fa7e1e, #d62976, #962fbf, #4f5bd5);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
    }
    h1 { color: #e1306c; text-align: center; margin: 0 0 8px; font-size: 32px; }
    .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 14px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      border: 1px solid #ddd; border-radius: 8px; font-size: 15px;
    }
    input:focus { outline: none; border-color: #e1306c; }
    button {
      width: 100%; background: #e1306c; color: white; border: none;
      padding: 14px; border-radius: 8px; font-size: 16px;
      font-weight: bold; cursor: pointer; margin-top: 8px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .toggle { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
    .toggle a { color: #e1306c; cursor: pointer; font-weight: bold; text-decoration: none; }
    #status {
      margin-top: 12px; padding: 10px; border-radius: 8px;
      font-size: 13px; display: none; white-space: pre-wrap; word-break: break-word;
    }
    .ok { background: #d4edda; color: #155724; display: block; }
    .err { background: #f8d7da; color: #721c24; display: block; }
    .info { background: #d1ecf1; color: #0c5460; display: block; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>বন্ধু</h1>
    <p class="subtitle" id="subtitle">Login koro</p>

    <form id="authForm">
      <input type="text" id="nameInput" placeholder="Tomar naam" class="hidden">
      <input type="text" id="usernameInput" placeholder="Username (@rahim)" class="hidden">
      <input type="email" id="emailInput" placeholder="Email" required>
      <input type="password" id="passwordInput" placeholder="Password (min 6 char)" required minlength="6">
      <button type="submit" id="submitBtn">Login</button>
    </form>

    <div id="status"></div>

    <div class="toggle">
      <span id="toggleText">Account nei?</span>
      <a id="toggleLink">Signup koro</a>
    </div>
  </div>

  <script type="module">
    import { signup, login, redirectIfLoggedIn } from "./js/auth.js";

    redirectIfLoggedIn("index.html");

    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("nameInput");
    const usernameInput = document.getElementById("usernameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const status = document.getElementById("status");
    const subtitle = document.getElementById("subtitle");
    const toggleText = document.getElementById("toggleText");
    const toggleLink = document.getElementById("toggleLink");

    let mode = "login";

    function setMode(newMode) {
      mode = newMode;
      if (mode === "signup") {
        nameInput.classList.remove("hidden");
        usernameInput.classList.remove("hidden");
        submitBtn.textContent = "Signup koro";
        subtitle.textContent = "Notun account banao";
        toggleText.textContent = "Account ache?";
        toggleLink.textContent = "Login koro";
      } else {
        nameInput.classList.add("hidden");
        usernameInput.classList.add("hidden");
        submitBtn.textContent = "Login";
        subtitle.textContent = "Login koro";
        toggleText.textContent = "Account nei?";
        toggleLink.textContent = "Signup koro";
      }
      status.className = "";
      status.style.display = "none";
    }

    toggleLink.addEventListener("click", (e) => {
      e.preventDefault();
      setMode(mode === "login" ? "signup" : "login");
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      status.className = "info";
      status.style.display = "block";
      status.textContent = mode === "login" ? "Login hocche..." : "Account banacchi...";

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      try {
        if (mode === "signup") {
          const name = nameInput.value.trim();
          const username = usernameInput.value.trim().replace("@", "").toLowerCase();

          if (!name) throw new Error("Naam likho");
          if (!username) throw new Error("Username likho");
          if (!/^[a-z0-9_]{3,20}$/.test(username)) {
            throw new Error("Username 3-20 char, sudhu a-z, 0-9, _");
          }

          await signup(email, password, name, username);
          status.className = "ok";
          status.textContent = "✅ Account create hoyeche!";
        } else {
          await login(email, password);
          status.className = "ok";
          status.textContent = "✅ Login successful!";
        }

        setTimeout(() => window.location.href = "index.html", 1000);
      } catch (err) {
        console.error("Auth error:", err);
        status.className = "err";
        status.style.display = "block";
        status.textContent = "❌ " + prettyError(err) +
          "\n\nCode: " + (err.code || "no-code");
        submitBtn.disabled = false;
      }
    });

    function prettyError(err) {
      const code = err.code || "";
      if (code === "auth/email-already-in-use") return "Ei email diye account already ache";
      if (code === "auth/invalid-email") return "Email ta thik nei";
      if (code === "auth/weak-password") return "Password onek durbol (min 6 char)";
      if (code === "auth/user-not-found") return "Ei email diye account nei";
      if (code === "auth/wrong-password") return "Password bhul";
      if (code === "auth/invalid-credential") return "Email ba password bhul";
      if (code === "auth/too-many-requests") return "Onek bar try korecho, ektu wait koro";
      if (code === "auth/network-request-failed") return "Network problem — internet check koro";
      if (code === "permission-denied") return "Firestore rules block korche";
      return err.message || "Kichu bhul hoyeche";
    }
  </script>
</body>
</html>
