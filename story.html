<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Story</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .progress-bar {
      display: flex; gap: 4px; padding: 10px 12px;
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    }
    .progress-segment {
      flex: 1; height: 3px; background: rgba(255,255,255,0.3);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill {
      height: 100%; background: white; width: 0%;
    }
    .progress-fill.done { width: 100%; }
    .progress-fill.active { animation: fill 5s linear forwards; }
    @keyframes fill { from { width: 0%; } to { width: 100%; } }

    .header {
      position: absolute; top: 20px; left: 0; right: 0;
      padding: 8px 16px; display: flex;
      align-items: center; gap: 12px; z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: linear-gradient(135deg, #feda75, #d62976);
      display: flex; align-items: center; justify-content: center;
      color: white; font-weight: bold; font-size: 15px;
      overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .header-info { flex: 1; }
    .header-info .name { font-weight: bold; font-size: 14px; }
    .header-info .time { font-size: 11px; opacity: 0.7; }
    .close-btn {
      background: none; border: none; color: white;
      font-size: 28px; cursor: pointer; padding: 0; line-height: 1;
    }

    .story-image {
      flex: 1; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .story-image img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
    }
    .caption {
      position: absolute; bottom: 40px; left: 20px; right: 20px;
      text-align: center; font-size: 16px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      background: rgba(0,0,0,0.4); padding: 10px 16px;
      border-radius: 20px; word-break: break-word;
    }

    /* Tap zones */
    .tap-left, .tap-right {
      position: absolute; top: 0; bottom: 0; width: 30%;
      z-index: 5; cursor: pointer;
    }
    .tap-left { left: 0; }
    .tap-right { right: 0; }

    .loading-screen {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <div class="header">
    <div class="avatar" id="avatar">?</div>
    <div class="header-info">
      <div class="name" id="userName">...</div>
      <div class="time" id="timeAgo"></div>
    </div>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>

  <div class="story-image" id="storyImage">
    <div class="loading-screen" id="loading">Loading...</div>
  </div>

  <div class="tap-left" id="tapLeft"></div>
  <div class="tap-right" id="tapRight"></div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { loadActiveStories, markStoryViewed } from "./js/stories.js";

    let allGroups = [];       // sob user er story group
    let currentGroupIdx = 0;  // kon user
    let currentStoryIdx = 0;  // kon story
    let timer = null;

    const params = new URLSearchParams(window.location.search);
    const startUsername = params.get("u");

    const progressBar = document.getElementById("progressBar");
    const storyImage = document.getElementById("storyImage");
    const avatar = document.getElementById("avatar");
    const userName = document.getElementById("userName");
    const timeAgo = document.getElementById("timeAgo");
    const loading = document.getElementById("loading");

    requireAuth(async () => {
      try {
        allGroups = await loadActiveStories();

        if (allGroups.length === 0) {
          storyImage.innerHTML = `<div class="loading-screen">Kono story nei</div>`;
          return;
        }

        // Jodi ?u=username thake, oi user diye start
        if (startUsername) {
          const idx = allGroups.findIndex(g =>
            (g.username || "").toLowerCase() === startUsername.toLowerCase()
          );
          if (idx >= 0) currentGroupIdx = idx;
        }

        currentStoryIdx = 0;
        renderStory();
      } catch (e) {
        storyImage.innerHTML = `<div class="loading-screen">❌ ${e.message}</div>`;
      }
    });

    function renderStory() {
      if (timer) clearTimeout(timer);

      const group = allGroups[currentGroupIdx];
      const story = group.stories[currentStoryIdx];

      // Progress bar setup
      progressBar.innerHTML = group.stories.map((_, i) => {
        if (i < currentStoryIdx) {
          return `<div class="progress-segment"><div class="progress-fill done"></div></div>`;
        } else if (i === currentStoryIdx) {
          return `<div class="progress-segment"><div class="progress-fill active"></div></div>`;
        } else {
          return `<div class="progress-segment"><div class="progress-fill"></div></div>`;
        }
      }).join("");

      // Header
      const initial = (group.userName || "?")[0].toUpperCase();
      avatar.innerHTML = group.userPhoto ? `<img src="${group.userPhoto}">` : initial;
      userName.textContent = group.userName;

      // Time ago
      const created = story.createdAt?.seconds ? story.createdAt.seconds * 1000 : Date.now();
      timeAgo.textContent = timeAgoCalc(created);

      // Story image
      storyImage.innerHTML = `
        <img src="${story.imageUrl}" alt="story">
        ${story.caption ? `<div class="caption">${escapeHtml(story.caption)}</div>` : ""}
      `;

      // View mark
      markStoryViewed(story.id).catch(() => {});

      // Auto advance — 5 sec
      timer = setTimeout(nextStory, 5000);
    }

    function nextStory() {
      const group = allGroups[currentGroupIdx];
      if (currentStoryIdx < group.stories.length - 1) {
        currentStoryIdx++;
        renderStory();
      } else {
        // Next user
        if (currentGroupIdx < allGroups.length - 1) {
          currentGroupIdx++;
          currentStoryIdx = 0;
          renderStory();
        } else {
          // Sesh — feed e ফিরে jao
          window.location.href = "index.html";
        }
      }
    }

    function prevStory() {
      if (currentStoryIdx > 0) {
        currentStoryIdx--;
        renderStory();
      } else {
        // Previous user
        if (currentGroupIdx > 0) {
          currentGroupIdx--;
          currentStoryIdx = 0;
          renderStory();
        }
      }
    }

    document.getElementById("tapRight").addEventListener("click", nextStory);
    document.getElementById("tapLeft").addEventListener("click", prevStory);
    document.getElementById("closeBtn").addEventListener("click", () => {
      window.location.href = "index.html";
    });

    function timeAgoCalc(t) {
      const diff = Math.floor((Date.now() - t) / 1000);
      if (diff < 60) return `${diff}s`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h`;
      return `${Math.floor(diff / 86400)}d`;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
