<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>বন্ধু — রিল</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#000}
  body{
    padding-bottom:0;color:#fff;
    font-family:'Hind Siliguri',system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  .reels-container{
    position:fixed;top:0;left:0;right:0;
    bottom:calc(72px + env(safe-area-inset-bottom));
    overflow-y:scroll;scroll-snap-type:y mandatory;
    scrollbar-width:none;background:#000;
    -webkit-overflow-scrolling:touch;
  }
  .reels-container::-webkit-scrollbar{display:none}

  .reel{
    height:100%;scroll-snap-align:start;
    position:relative;display:flex;
    align-items:center;justify-content:center;
    background:#000;overflow:hidden;
  }
  .reel video{
    width:100%;height:100%;object-fit:contain;
    background:#000;display:block;pointer-events:none;
  }

  .tap-zone{
    position:absolute;top:0;bottom:0;width:32%;z-index:3;cursor:pointer;
  }
  .tap-zone.left{left:0}
  .tap-zone.right{right:0}

  .play-indicator{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:80px;height:80px;border-radius:50%;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;justify-content:center;
    z-index:5;pointer-events:none;opacity:0;
    transition:opacity .25s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .play-indicator.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .play-indicator svg{width:36px;height:36px;fill:#fff;stroke:#fff;stroke-width:1}

  .seek-indicator{
    position:absolute;top:50%;transform:translateY(-50%) scale(.7);
    padding:12px 20px;background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:30px;color:#fff;font-size:14px;font-weight:600;
    display:flex;align-items:center;gap:8px;z-index:6;
    opacity:0;pointer-events:none;
    transition:opacity .2s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .seek-indicator.show{opacity:1;transform:translateY(-50%) scale(1)}
  .seek-indicator.left{left:20%}
  .seek-indicator.right{right:20%}
  .seek-indicator svg{width:18px;height:18px;fill:#fff;stroke:#fff;stroke-width:1}

  .reel-overlay{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,transparent 20%,transparent 55%,rgba(0,0,0,.75) 100%);
    z-index:2;
  }

  .reel-info{
    position:absolute;bottom:80px;left:16px;right:90px;
    z-index:4;pointer-events:auto;
  }
  .reel-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .reel-av{
    width:40px;height:40px;border-radius:50%;
    background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:15px;overflow:hidden;
    border:2px solid rgba(255,255,255,.4);flex-shrink:0;
  }
  .reel-av img{width:100%;height:100%;object-fit:cover}
  .reel-username{
    font-family:'Playfair Display',serif;font-weight:700;font-size:14px;
    color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .reel-caption{
    font-size:13.5px;line-height:1.5;color:#f5f5f5;
    text-shadow:0 1px 3px rgba(0,0,0,.7);word-break:break-word;
    max-height:80px;overflow:hidden;
  }

  .reel-actions{
    position:absolute;right:12px;bottom:100px;
    display:flex;flex-direction:column;gap:18px;
    align-items:center;z-index:4;pointer-events:auto;
  }
  .reel-btn{
    background:none;border:none;color:#fff;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    font-size:11px;font-weight:600;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    text-shadow:0 1px 3px rgba(0,0,0,.6);padding:4px;
  }
  .reel-btn:hover{transform:scale(1.15)}
  .reel-btn:active{transform:scale(.9);transition-duration:.1s}
  .reel-btn svg{
    width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.5));
  }
  .reel-btn.liked svg{fill:#e1306c;stroke:#e1306c}
  .reel-btn.liked{color:#ffb3d1}

  .video-progress{
    position:absolute;left:0;right:0;bottom:56px;height:32px;
    z-index:7;cursor:pointer;display:flex;align-items:center;
    padding:0 16px;touch-action:none;pointer-events:auto;
  }
  .progress-track{
    position:relative;width:100%;height:3px;
    background:rgba(255,255,255,.3);border-radius:3px;
    overflow:visible;transition:height .2s;
  }
  .video-progress:hover .progress-track,
  .video-progress.active .progress-track{height:5px}
  .progress-fill{
    position:absolute;top:0;left:0;bottom:0;
    background:#fff;border-radius:3px;width:0%;
    transition:width .1s linear;pointer-events:none;
  }
  .progress-handle{
    position:absolute;top:50%;left:0%;
    transform:translate(-50%,-50%) scale(0);
    width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5);
    transition:transform .2s cubic-bezier(.34,1.56,.64,1);pointer-events:none;
  }
  .video-progress:hover .progress-handle,
  .video-progress.active .progress-handle{transform:translate(-50%,-50%) scale(1)}
  .progress-time{
    position:absolute;top:-28px;transform:translateX(-50%);
    background:rgba(0,0,0,.75);color:#fff;
    padding:3px 8px;border-radius:6px;
    font-size:10.5px;font-weight:600;opacity:0;
    pointer-events:none;transition:opacity .2s;white-space:nowrap;
    font-family:'Playfair Display',serif;
  }
  .video-progress.active .progress-time{opacity:1}

  .reels-topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 16px;z-index:20;
    background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%);
    pointer-events:auto;
  }
  .reels-topbar .title{
    font-family:'Playfair Display',serif;font-size:22px;font-weight:800;
    color:#fff;letter-spacing:-.5px;text-shadow:0 2px 6px rgba(0,0,0,.5);
  }
  .reels-topbar .title em{color:var(--accent-2);font-style:italic;font-weight:500}
  .reels-topbar .actions{display:flex;gap:8px}
  .reels-topbar .icon-btn{background:rgba(0,0,0,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .reels-topbar .icon-btn svg{stroke:#fff}
  .reels-topbar .icon-btn:hover{background:rgba(255,255,255,.2)}
  .reels-topbar .theme-toggle{
    background:rgba(0,0,0,.35);border-color:transparent;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .reels-topbar .theme-toggle svg{stroke:#fff}

  .reels-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:16px;color:#999;text-align:center;padding:40px 20px;
  }
  .reels-empty svg{width:64px;height:64px;stroke:#666;fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
  .reels-empty a{
    color:var(--accent-2);font-weight:600;padding:10px 20px;
    border-radius:24px;background:rgba(124,179,66,.15);
    border:1px solid rgba(124,179,66,.3);text-decoration:none;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .reels-empty a:hover{transform:translateY(-2px)}

  .global-tap-layer{position:absolute;inset:0;z-index:3;cursor:pointer}

  .heart-burst{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0);
    width:120px;height:120px;pointer-events:none;z-index:8;opacity:0;
  }
  .heart-burst svg{width:100%;height:100%;fill:#e1306c;filter:drop-shadow(0 4px 12px rgba(225,48,108,.6))}
  .heart-burst.show{animation:heartPop .8s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes heartPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}
    50%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}
  }
</style>
</head>
<body>

<div class="reels-topbar">
  <div class="title">রিল<em>.</em></div>
  <div class="actions">
    <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
    <a href="reel-upload.html" class="icon-btn" aria-label="Upload">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </a>
    <a href="index.html" class="icon-btn" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    </a>
  </div>
</div>

<div class="reels-container" id="container">
  <div class="reels-empty">
    <div class="spinner" style="border-color:rgba(255,255,255,.2);border-top-color:#7cb342"></div>
    <div>লোড হচ্ছে...</div>
  </div>
</div>

<div class="menu-pop" id="menuPop" style="position:fixed;background:var(--paper-elev);border:1px solid var(--rule);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);padding:6px;z-index:300;display:none;min-width:190px"></div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></a>
  <a href="upload.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
  <a href="reels.html" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg></a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></a>
</nav>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { loadReels, toggleReelLike, deleteReel } from "./js/reels.js";
  import { showToast, showConfirm } from "./js/toast.js";
  import { openReportModal } from "./js/report.js";

  let currentUser = null;
  let currentReels = [];
  const container = document.getElementById("container");
  const menuPop = document.getElementById("menuPop");
  const observer = new IntersectionObserver(onIntersect, { threshold: 0.6 });

  function formatTime(sec) {
    if (!isFinite(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  requireAuth(async (user) => {
    currentUser = user;
    await render();
    setupObserver();
  });

  async function render() {
    try {
      const reels = await loadReels();
      currentReels = reels;

      if (reels.length === 0) {
        container.innerHTML = `
          <div class="reels-empty">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg>
            <div>এখনো কোনো রিল নেই</div>
            <a href="reel-upload.html">প্রথম রিল তৈরি করুন</a>
          </div>`;
        return;
      }

      container.innerHTML = reels.map(r => {
        const isLiked = r.likes?.includes(currentUser.uid);
        const isMine = r.userId === currentUser.uid;
        const initial = (r.userName || "?")[0].toUpperCase();
        return `
          <div class="reel" data-id="${r.id}">
            <video src="${r.videoUrl}" loop playsinline preload="metadata" muted webkit-playsinline></video>

            <div class="reel-overlay"></div>
            <div class="global-tap-layer"></div>
            <div class="tap-zone left"></div>
            <div class="tap-zone right"></div>

            <div class="play-indicator">
              <svg class="icon-play" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg>
              <svg class="icon-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </div>

            <div class="seek-indicator left">
              <div style="display:flex;gap:-2px">
                <svg viewBox="0 0 24 24" style="opacity:.5"><polyline points="11 17 6 12 11 7"/></svg>
                <svg viewBox="0 0 24 24"><polyline points="18 17 13 12 18 7"/></svg>
              </div>
              <span>১০ সেকেন্ড</span>
            </div>
            <div class="seek-indicator right">
              <span>১০ সেকেন্ড</span>
              <div style="display:flex;gap:-2px">
                <svg viewBox="0 0 24 24"><polyline points="13 17 18 12 13 7"/></svg>
                <svg viewBox="0 0 24 24" style="opacity:.5"><polyline points="6 17 11 12 6 7"/></svg>
              </div>
            </div>

            <div class="heart-burst">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            </div>

            <div class="reel-info">
              <div class="reel-user">
                <div class="reel-av">${r.userPhoto ? `<img src="${r.userPhoto}">` : initial}</div>
                <div class="reel-username">@${escapeHtml(r.username || "?")}</div>
              </div>
              ${r.caption ? `<div class="reel-caption">${escapeHtml(r.caption)}</div>` : ""}
            </div>

            <div class="reel-actions">
              <button class="reel-btn like-btn ${isLiked ? "liked" : ""}" data-id="${r.id}">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span class="like-count">${r.likes?.length || 0}</span>
              </button>
              <button class="reel-btn menu-btn" data-id="${r.id}">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
                <span>আরও</span>
              </button>
            </div>

            <div class="video-progress" data-progress>
              <div class="progress-track">
                <div class="progress-fill"></div>
                <div class="progress-handle"></div>
                <div class="progress-time">0:00</div>
              </div>
            </div>
          </div>`;
      }).join("");

      attachAllHandlers();
    } catch (e) {
      container.innerHTML = `<div class="reels-empty">❌ ${e.message}</div>`;
      console.error(e);
    }
  }

  function attachAllHandlers() {
    container.querySelectorAll(".reel").forEach((reelEl) => {
      const video = reelEl.querySelector("video");
      const tapLeft = reelEl.querySelector(".tap-zone.left");
      const tapRight = reelEl.querySelector(".tap-zone.right");
      const playIndicator = reelEl.querySelector(".play-indicator");
      const iconPlay = playIndicator.querySelector(".icon-play");
      const iconPause = playIndicator.querySelector(".icon-pause");
      const seekLeft = reelEl.querySelector(".seek-indicator.left");
      const seekRight = reelEl.querySelector(".seek-indicator.right");
      const heart = reelEl.querySelector(".heart-burst");
      const progressWrap = reelEl.querySelector(".video-progress");
      const progressFill = reelEl.querySelector(".progress-fill");
      const progressHandle = reelEl.querySelector(".progress-handle");
      const progressTime = reelEl.querySelector(".progress-time");

      let lastTapLeft = 0, lastTapRight = 0;
      let lastCenterTap = 0;

      tapLeft.addEventListener("click", (e) => {
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTapLeft < 400) {
          video.currentTime = Math.max(0, video.currentTime - 10);
          showSeekIndicator(seekLeft);
          lastTapLeft = 0;
        } else {
          lastTapLeft = now;
          setTimeout(() => {
            if (Date.now() - lastTapLeft >= 400) scrollPrev();
          }, 400);
        }
      });

      tapRight.addEventListener("click", (e) => {
        e.stopPropagation();
        const now = Date.now();
        if (now - lastTapRight < 400) {
          video.currentTime = Math.min(video.duration || 0, video.currentTime + 10);
          showSeekIndicator(seekRight);
          lastTapRight = 0;
        } else {
          lastTapRight = now;
          setTimeout(() => {
            if (Date.now() - lastTapRight >= 400) scrollNext();
          }, 400);
        }
      });

      const globalTap = reelEl.querySelector(".global-tap-layer");
      globalTap.addEventListener("click", (e) => {
        const rect = reelEl.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const w = rect.width;
        if (x < w * 0.32 || x > w * 0.68) return;

        const now = Date.now();
        if (now - lastCenterTap < 300) {
          likeReel(reelEl);
          showHeart(heart);
          lastCenterTap = 0;
        } else {
          lastCenterTap = now;
          setTimeout(() => {
            if (Date.now() - lastCenterTap >= 300) {
              togglePlay(video, iconPlay, iconPause, playIndicator);
            }
          }, 300);
        }
      });

      const likeBtn = reelEl.querySelector(".like-btn");
      likeBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        likeReel(reelEl);
      });

      const menuBtn = reelEl.querySelector(".menu-btn");
      menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const reel = currentReels.find(r => r.id === reelEl.dataset.id);
        if (reel) openReelMenu(e, reel);
      });

      // Progress seek
      let isDragging = false;
      function getPercentFromEvent(clientX) {
        const rect = progressWrap.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        return Math.max(0, Math.min(1, pct));
      }
      function updateProgressUI(pct) {
        progressFill.style.width = (pct * 100) + "%";
        progressHandle.style.left = (pct * 100) + "%";
        progressTime.style.left = (pct * 100) + "%";
        if (video.duration) progressTime.textContent = formatTime(pct * video.duration);
      }
      function beginDrag(e) {
        isDragging = true;
        progressWrap.classList.add("active");
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const pct = getPercentFromEvent(clientX);
        updateProgressUI(pct);
        if (video.duration) video.currentTime = pct * video.duration;
      }
      function moveDrag(e) {
        if (!isDragging) return;
        e.preventDefault();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const pct = getPercentFromEvent(clientX);
        updateProgressUI(pct);
        if (video.duration) video.currentTime = pct * video.duration;
      }
      function endDrag() {
        if (!isDragging) return;
        isDragging = false;
        setTimeout(() => progressWrap.classList.remove("active"), 500);
      }
      progressWrap.addEventListener("mousedown", (e) => { e.stopPropagation(); beginDrag(e); });
      window.addEventListener("mousemove", moveDrag);
      window.addEventListener("mouseup", endDrag);
      progressWrap.addEventListener("touchstart", (e) => { e.stopPropagation(); beginDrag(e); }, { passive: true });
      progressWrap.addEventListener("touchmove", moveDrag, { passive: false });
      progressWrap.addEventListener("touchend", endDrag);
      progressWrap.addEventListener("touchcancel", endDrag);

      video.addEventListener("timeupdate", () => {
        if (isDragging) return;
        if (!video.duration) return;
        const pct = video.currentTime / video.duration;
        progressFill.style.width = (pct * 100) + "%";
        progressHandle.style.left = (pct * 100) + "%";
      });
      video.addEventListener("loadedmetadata", () => {
        progressTime.textContent = formatTime(video.duration);
      });
    });
  }

  function openReelMenu(e, reel) {
    const isMine = reel.userId === currentUser.uid;
    menuPop.innerHTML = `
      ${isMine ? `
        <button data-act="delete" class="danger" style="color:#c62828;width:100%;padding:11px 14px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px;text-align:left">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
          রিল মুছুন
        </button>
      ` : `
        <button data-act="report" class="danger" style="color:#c62828;width:100%;padding:11px 14px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px;text-align:left">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          রিপোর্ট করুন
        </button>
      `}
      <button data-act="copy" style="width:100%;padding:11px 14px;border:none;background:transparent;color:var(--ink);font-family:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:10px;cursor:pointer;border-radius:9px;text-align:left">
        <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        লিংক কপি
      </button>
    `;
    menuPop.style.display = "block";
    const rect = menuPop.getBoundingClientRect();
    let left = e.clientX - rect.width - 10;
    let top = e.clientY - 20;
    if (left < 10) left = 10;
    if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
    if (top + rect.height > window.innerHeight - 10) top = window.innerHeight - rect.height - 10;
    if (top < 10) top = 10;
    menuPop.style.left = left + "px";
    menuPop.style.top = top + "px";

    menuPop.querySelectorAll("button").forEach(b => {
      b.onclick = async () => {
        const act = b.dataset.act;
        menuPop.style.display = "none";

        if (act === "delete") {
          const ok = await showConfirm("এই রিলটি মুছে ফেলবেন?", { title: "রিল মুছুন", okText: "মুছে ফেলুন" });
          if (!ok) return;
          try {
            await deleteReel(reel.id);
            const el = container.querySelector(`.reel[data-id="${reel.id}"]`);
            if (el) el.remove();
            showToast("মুছে ফেলা হয়েছে", "ok");
          } catch (err) { showToast(err.message, "err"); }
        } else if (act === "report") {
          openReportModal({
            targetType: "reel",
            targetId: reel.id,
            targetUsername: reel.username
          }, () => showToast("✅ রিপোর্ট পাঠানো হয়েছে", "ok"));
        } else if (act === "copy") {
          try {
            await navigator.clipboard.writeText(location.origin + "/bondhu/reels.html");
            showToast("লিংক কপি হয়েছে", "ok");
          } catch (err) { showToast("কপি ব্যর্থ", "err"); }
        }
      };
    });
  }

  document.addEventListener("click", (e) => {
    if (!menuPop.contains(e.target)) menuPop.style.display = "none";
  });

  function togglePlay(video, iconPlay, iconPause, indicator) {
    if (video.paused) {
      video.play().catch(() => {});
      iconPlay.style.display = "none";
      iconPause.style.display = "block";
      showIndicator(indicator);
    } else {
      video.pause();
      iconPlay.style.display = "block";
      iconPause.style.display = "none";
      showIndicator(indicator);
    }
  }

  function showIndicator(el) {
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 600);
  }
  function showSeekIndicator(el) {
    el.classList.add("show");
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove("show"), 500);
  }
  function showHeart(el) {
    el.classList.remove("show");
    void el.offsetWidth;
    el.classList.add("show");
  }

  async function likeReel(reelEl) {
    const btn = reelEl.querySelector(".like-btn");
    const reel = currentReels.find(r => r.id === reelEl.dataset.id);
    if (!reel) return;
    try {
      const nowLiked = await toggleReelLike(reel.id, reel.likes || []);
      btn.classList.toggle("liked", nowLiked);
      const span = btn.querySelector(".like-count");
      const prev = reel.likes?.length || 0;
      span.textContent = prev + (nowLiked ? 1 : -1);
      reel.likes = nowLiked ? [...(reel.likes || []), currentUser.uid] : (reel.likes || []).filter(u => u !== currentUser.uid);
    } catch (e) { console.error(e); }
  }

  function scrollNext() {
    const reels = [...container.querySelectorAll(".reel")];
    const cur = reels.findIndex(r => {
      const rect = r.getBoundingClientRect();
      return rect.top >= -10 && rect.top < window.innerHeight / 2;
    });
    if (cur >= 0 && cur < reels.length - 1) reels[cur + 1].scrollIntoView({ behavior: "smooth" });
  }
  function scrollPrev() {
    const reels = [...container.querySelectorAll(".reel")];
    const cur = reels.findIndex(r => {
      const rect = r.getBoundingClientRect();
      return rect.top >= -10 && rect.top < window.innerHeight / 2;
    });
    if (cur > 0) reels[cur - 1].scrollIntoView({ behavior: "smooth" });
  }

  function setupObserver() {
    container.querySelectorAll(".reel").forEach(r => observer.observe(r));
  }

  function onIntersect(entries) {
    entries.forEach((entry) => {
      const video = entry.target.querySelector("video");
      if (!video) return;
      if (entry.isIntersecting) {
        video.muted = false;
        video.play().catch(() => { video.muted = true; video.play().catch(() => {}); });
      } else {
        video.pause();
        video.currentTime = 0;
      }
    });
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
