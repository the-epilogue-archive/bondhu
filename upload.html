<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Post</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #fafafa; margin: 0 auto; padding: 20px; max-width: 500px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .topbar h2 { color: #e1306c; margin: 0; }
    .topbar a { color: #e1306c; text-decoration: none; font-weight: bold; }
    .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    input[type="file"] { margin: 10px 0; padding: 10px; width: 100%; box-sizing: border-box; }
    textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; font-family: inherit; resize: vertical; min-height: 80px; margin-top: 10px; box-sizing: border-box; }
    button { width: 100%; background: #e1306c; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 12px; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 14px; display: none; white-space: pre-wrap; word-break: break-word; }
    .ok { background: #d4edda; color: #155724; display: block; }
    .err { background: #f8d7da; color: #721c24; display: block; }
    .info { background: #d1ecf1; color: #0c5460; display: block; }
    #preview { margin-top: 15px; max-width: 100%; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <div class="topbar">
    <h2>Post banao</h2>
    <a href="index.html">← Feed</a>
  </div>

  <div class="box">
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="preview">
    <textarea id="captionInput" placeholder="Caption likho..."></textarea>
    <button id="postBtn" type="button">Post koro</button>
    <div id="status"></div>
  </div>

  <script type="module">
    const statusEl = document.getElementById("status");
    function showStatus(cls, msg) {
      statusEl.className = cls;
      statusEl.style.display = "block";
      statusEl.textContent = msg;
    }

    // 1) Sob import ekbar e koro — error hole dhora porbe
    let authMod, uploadMod, feedMod;
    try {
      authMod = await import("./js/auth.js");
      uploadMod = await import("./js/upload.js");
      feedMod = await import("./js/feed.js");
    } catch (e) {
      console.error("Import fail:", e);
      showStatus("err", "❌ Import fail: " + e.message);
      throw e;
    }

    const { getCurrentUser } = authMod;
    const { uploadToGitHub, hasToken } = uploadMod;
    const { createPost } = feedMod;

    // 2) Login check
    const user = getCurrentUser();
    if (!user) {
      window.location.href = "login.html";
      throw new Error("Not logged in");
    }

    console.log("✅ Script loaded. User:", user);

    const fileInput = document.getElementById("fileInput");
    const captionInput = document.getElementById("captionInput");
    const postBtn = document.getElementById("postBtn");
    const preview = document.getElementById("preview");

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (f) {
        preview.src = URL.createObjectURL(f);
        preview.style.display = "block";
      }
    });

    postBtn.addEventListener("click", async () => {
      console.log("🟡 Post button clicked");

      const file = fileInput.files[0];
      if (!file) {
        showStatus("err", "Image select koro");
        return;
      }

      if (!hasToken()) {
        showStatus("err", "Settings page e giye GitHub token set koro");
        return;
      }

      postBtn.disabled = true;
      showStatus("info", "Upload hocche... ⏳");

      try {
        console.log("🟡 Uploading to GitHub...");
        const imageUrl = await uploadToGitHub(file, "posts");
        console.log("🟢 Image URL:", imageUrl);

        console.log("🟡 Creating post in Firestore...");
        const postId = await createPost(imageUrl, captionInput.value.trim());
        console.log("🟢 Post created:", postId);

        showStatus("ok", "✅ Post hoyeche! Feed e jaccho...");
        setTimeout(() => window.location.href = "index.html", 1200);
      } catch (e) {
        console.error("🔴 Post error:", e);
        showStatus("err", "❌ " + (e.message || "Unknown error") +
          "\n\nCode: " + (e.code || "no-code"));
        postBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
