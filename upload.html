<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - Post</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: sans-serif;
      background: #fafafa;
      margin: 0;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .topbar h2 { color: #e1306c; margin: 0; }
    .topbar a { color: #e1306c; text-decoration: none; font-weight: bold; }
    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    input[type="file"] {
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
    }
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      resize: vertical;
      min-height: 80px;
      margin-top: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background: #e1306c;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status {
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .ok { background: #d4edda; color: #155724; display: block; }
    .err { background: #f8d7da; color: #721c24; display: block; }
    .info { background: #d1ecf1; color: #0c5460; display: block; }
    #preview {
      margin-top: 15px;
      max-width: 100%;
      border-radius: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h2>Post banao</h2>
    <a href="index.html">← Feed</a>
  </div>

  <div class="box">
    <input type="file" id="fileInput" accept="image/*">
    <img id="preview" alt="preview">
    <textarea id="captionInput" placeholder="Caption likho..."></textarea>
    <button id="postBtn">Post koro</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { requireAuth } from "./js/auth.js";
    import { uploadToGitHub } from "./js/upload.js";
    import { createPost } from "./js/feed.js";
    import { hasToken } from "./js/upload.js";

    requireAuth(() => {});

    const fileInput = document.getElementById("fileInput");
    const captionInput = document.getElementById("captionInput");
    const postBtn = document.getElementById("postBtn");
    const status = document.getElementById("status");
    const preview = document.getElementById("preview");

    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0];
      if (f) {
        preview.src = URL.createObjectURL(f);
        preview.style.display = "block";
      }
    });

    postBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        status.className = "err";
        status.textContent = "Image select koro";
        return;
      }

      if (!hasToken()) {
        status.className = "err";
        status.textContent = "Settings page e giye GitHub token set koro";
        return;
      }

      postBtn.disabled = true;
      status.className = "info";
      status.textContent = "Upload hocche... ⏳";

      try {
        const imageUrl = await uploadToGitHub(file, "posts");
        await createPost(imageUrl, captionInput.value.trim());
        status.className = "ok";
        status.textContent = "✅ Post hoyeche! Feed e jaccho...";
        setTimeout(() => window.location.href = "index.html", 1200);
      } catch (e) {
        status.className = "err";
        status.textContent = "❌ " + e.message;
        postBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
