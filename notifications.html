<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — খবর</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  .mark-all-btn{
    font-size:12px;
    color:var(--accent);
    font-weight:600;
    padding:8px 14px;
    border-radius:20px;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    font-family:'Hind Siliguri',sans-serif;
  }
  .mark-all-btn:hover{
    background:var(--accent-soft);
    transform:translateY(-2px);
  }

  .notif-list{padding-top:10px}

  .notif{
    display:flex;
    gap:14px;
    padding:14px 12px;
    border-radius:12px;
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    border-bottom:1px solid var(--rule);
    will-change:transform;
    position:relative;
  }
  .notif:hover{
    background:var(--accent-soft);
    transform:translateX(4px);
  }
  .notif:last-child{border-bottom:none}

  .notif.unread::before{
    content:'';
    position:absolute;
    left:2px;top:50%;
    transform:translateY(-50%);
    width:6px;height:6px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 6px var(--accent-glow);
  }

  .notif-icon{
    width:44px;height:44px;
    border-radius:50%;
    background:var(--paper-2);
    border:1px solid var(--rule);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:all .3s;
  }
  .notif:hover .notif-icon{
    background:var(--accent);
    border-color:var(--accent);
  }
  .notif-icon svg{
    width:20px;height:20px;
    stroke:var(--ink-soft);fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;
    transition:stroke .3s;
  }
  .notif:hover .notif-icon svg{stroke:var(--accent-text)}
  .notif-icon.like svg{fill:var(--accent);stroke:var(--accent)}
  .notif:hover .notif-icon.like svg{fill:var(--accent-text);stroke:var(--accent-text)}

  .notif-body{flex:1;min-width:0}
  .notif-text{
    font-size:13.5px;
    color:var(--ink);
    line-height:1.5;
    margin-bottom:4px;
  }
  .notif-text b{
    font-family:'Playfair Display',serif;
    font-weight:700;
    color:var(--ink);
  }
  .notif-text em{
    font-style:italic;
    color:var(--ink-mute);
    font-family:'Playfair Display',serif;
  }
  .notif-time{
    font-size:11px;
    color:var(--ink-mute);
    font-style:italic;
    font-family:'Playfair Display',serif;
  }
</style>
</head>
<body>

<div class="page">

<nav data-component="topbar" data-title="খবর"></nav>
  
<div style="display:flex;align-items:center;gap:12px;padding:24px 0 16px">
  <div class="section-head" style="padding:0;margin:0;flex:1">সাম্প্রতিক খবর</div>
  <button class="btn btn-sm btn-ghost" id="markAllBtn" style="padding:6px 12px;font-size:12px;width:auto;flex-shrink:0">সব পড়া</button>
</div>
  
  <div class="notif-list" id="list">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div>লোড হচ্ছে...</div>
    </div>
  </div>

</div>

<nav data-component="bottom-nav" data-active=""></nav>
  
<script type="module">
  import { requireAuth, getAllUsersList } from "./js/auth.js";
  import { loadMyNotifications, markRead, markAllRead } from "./js/notifications.js";
  import "./js/components.js";
  let allUsers = {};
  let currentUser = null;

  requireAuth(async (user) => {
    currentUser = user;
    const users = await getAllUsersList();
    users.forEach(u => { allUsers[u.uid] = u; });
    await load();
  });

  document.getElementById("markAllBtn").addEventListener("click", async () => {
    await markAllRead();
    await load();
  });

  async function load() {
    const list = document.getElementById("list");
    try {
      const notifs = await loadMyNotifications();
      if (notifs.length === 0) {
        list.innerHTML = `<div class="empty">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          কোনো খবর নেই
        </div>`;
        return;
      }

      list.innerHTML = notifs.map(n => {
        const fromUser = allUsers[n.fromUid] || {};
        const fromName = fromUser.name || "কেউ একজন";
        const isReel = n.extra === "reel";

        let icon, text;
        if (n.type === "like") {
          icon = `<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
          text = `<b>${escapeHtml(fromName)}</b> আপনার ${isReel ? "রিল" : "পোস্ট"} পছন্দ করেছেন`;
        } else if (n.type === "comment") {
          icon = `<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
          text = `<b>${escapeHtml(fromName)}</b> মন্তব্য করেছেন${n.extra ? ` — <em>"${escapeHtml(n.extra)}"</em>` : ""}`;
        } else if (n.type === "follow") {
          icon = `<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
          text = `<b>${escapeHtml(fromName)}</b> আপনাকে অনুসরণ করছেন`;
        } else {
          icon = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>`;
          text = `<b>${escapeHtml(fromName)}</b> একটি বার্তা পাঠিয়েছেন`;
        }

        const time = timeAgo(n.createdAt?.seconds ? n.createdAt.seconds * 1000 : Date.now());

        return `
          <div class="notif ${n.read ? "" : "unread"}" data-id="${n.id}" data-from="${n.fromUid}" data-type="${n.type}" data-post="${n.postId || ""}">
            <div class="notif-icon ${n.type === "like" ? "like" : ""}">${icon}</div>
            <div class="notif-body">
              <div class="notif-text">${text}</div>
              <div class="notif-time">${time}</div>
            </div>
          </div>`;
      }).join("");

      list.querySelectorAll(".notif").forEach(el => {
        el.addEventListener("click", async () => {
          await markRead(el.dataset.id);
          el.classList.remove("unread");
          const fromUser = allUsers[el.dataset.from] || {};
          if (el.dataset.type === "follow" && fromUser.username) {
            window.location.href = `user.html?u=${encodeURIComponent(fromUser.username)}`;
          } else if (el.dataset.post && el.dataset.type === "like" && el.dataset.post) {
            window.location.href = "index.html";
          } else if (el.dataset.type === "comment") {
            window.location.href = "index.html";
          }
        });
      });
    } catch (e) {
      list.innerHTML = `<div class="empty">❌ ${e.message}</div>`;
    }
  }

  function timeAgo(t) {
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff} সেকেন্ড আগে`;
    if (diff < 3600) return `${Math.floor(diff / 60)} মিনিট আগে`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} ঘণ্টা আগে`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} দিন আগে`;
    return new Date(t).toLocaleDateString("bn-BD");
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
