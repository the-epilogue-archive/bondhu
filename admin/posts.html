<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — পোস্ট</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="css/admin.css">
<script src="../js/theme.js"></script>
<script src="js/admin-config.js"></script>
<style>
  .posts-filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .filter-tab{
    padding:7px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    background:var(--paper-elev);
    border:1px solid var(--rule);
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .3s cubic-bezier(.34,1.56,.64,1);
    font-family:inherit;
  }
  .filter-tab:hover{
    transform:translateY(-2px);
    border-color:var(--accent-border);
  }
  .filter-tab.active{
    background:var(--accent);
    color:var(--accent-text);
    border-color:var(--accent);
    box-shadow:0 4px 12px var(--accent-glow);
  }

  .posts-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
  }
  @media (min-width:768px){
    .posts-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
  }

  .post-card{
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .post-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent-border);
    box-shadow:0 10px 28px var(--shadow-md);
  }
  .post-card-img{
    width:100%;
    aspect-ratio:1/1;
    background:var(--paper-2);
    position:relative;
    overflow:hidden;
  }
  .post-card-img img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:block;
  }
  .post-card:hover .post-card-img img{
    transform:scale(1.05);
  }
  .post-card-badge{
    position:absolute;
    top:8px;right:8px;
    display:flex;
    gap:4px;
  }
  .post-card-pill{
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:3px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .post-card-pill svg{
    width:11px;height:11px;
    stroke:currentColor;fill:none;stroke-width:2;
  }
  .post-card-body{
    padding:10px 12px 12px;
  }
  .post-card-author{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:6px;
  }
  .post-card-avatar{
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent);
    color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    overflow:hidden;
    flex-shrink:0;
  }
  .post-card-avatar img{
    width:100%;height:100%;object-fit:cover;
  }
  .post-card-username{
    font-size:11.5px;
    color:var(--ink-mute);
    font-style:italic;
    font-family:'Playfair Display',serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .post-card-caption{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.45;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    min-height:36px;
  }
  .post-card-time{
    font-size:10.5px;
    color:var(--ink-mute);
    margin-top:6px;
    font-style:italic;
    font-family:'Playfair Display',serif;
  }
</style>
</head>
<body class="admin">

<div class="admin-shell">
  <aside id="adminSidebar"></aside>

  <div class="admin-main">

    <header class="admin-topbar" id="adminTopbar">
      <div class="admin-topbar-brand">
        পোস্ট
        <span class="admin-badge" id="postCountBadge">—</span>
      </div>
      <div class="admin-topbar-actions">
        <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <div class="admin-page">

      <div class="admin-page-head">
        <div>
          <div class="admin-page-title">সমস্ত পোস্ট</div>
          <div class="admin-page-sub">সাইটের সব পোস্টের তালিকা ও ব্যবস্থাপনা</div>
        </div>
      </div>

      <div class="posts-filters" id="filterTabs">
        <button class="filter-tab active" data-filter="all">সব</button>
        <button class="filter-tab" data-filter="recent">নতুন</button>
        <button class="filter-tab" data-filter="liked">জনপ্রিয়</button>
        <button class="filter-tab" data-filter="image">শুধু ছবি</button>
      </div>

      <div class="admin-search" style="max-width:340px;margin-bottom:18px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ক্যাপশন বা ইউজারনেম...">
      </div>

      <div class="posts-grid" id="postsGrid">
        <div class="admin-empty" style="grid-column:1/-1">
          <div class="spinner" style="margin:0 auto 12px;border-color:var(--rule);border-top-color:var(--accent)"></div>
          লোড হচ্ছে...
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Post detail modal -->
<div id="postModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s">
  <div id="postModalBox" style="background:var(--paper-elev);border:1px solid var(--rule);border-radius:18px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);transform:scale(.94);transition:transform .3s cubic-bezier(.34,1.56,.64,1)">
    <div id="postModalContent"></div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from "./js/admin-auth.js";
  import { getAllPosts, deletePostById } from "./js/admin-data.js";
  import { showToast, showConfirm } from "../js/toast.js";
  import "./js/admin-sidebar.js";

  let allPosts = [];
  let filteredPosts = [];
  let currentFilter = "all";

  requireAdmin(() => {
    loadPosts();
    document.getElementById("searchInput").addEventListener("input", applyFilters);
    document.querySelectorAll(".filter-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        currentFilter = tab.dataset.filter;
        document.querySelectorAll(".filter-tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        applyFilters();
      });
    });
  });

  // ==========================================
  // Load
  // ==========================================
  async function loadPosts() {
    const grid = document.getElementById("postsGrid");
    try {
      allPosts = await getAllPosts();
      filteredPosts = [...allPosts];
      renderGrid();
      document.getElementById("postCountBadge").textContent = `${bnNum(allPosts.length)} টি`;
    } catch (e) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">${emptyState("লোড ব্যর্থ: " + e.message)}</div>`;
    }
  }

  // ==========================================
  // Filters
  // ==========================================
  function applyFilters() {
    const term = document.getElementById("searchInput").value.trim().toLowerCase();

    let list = [...allPosts];

    if (term) {
      list = list.filter(p =>
        (p.caption || "").toLowerCase().includes(term) ||
        (p.username || "").toLowerCase().includes(term) ||
        (p.userName || "").toLowerCase().includes(term)
      );
    }

    if (currentFilter === "recent") {
      const week = Date.now() - 7 * 24 * 60 * 60 * 1000;
      list = list.filter(p => p.createdAt?.seconds && (p.createdAt.seconds * 1000) >= week);
    } else if (currentFilter === "liked") {
      list = list.filter(p => (p.likes?.length || 0) >= 5);
      list.sort((a, b) => (b.likes?.length || 0) - (a.likes?.length || 0));
    } else if (currentFilter === "image") {
      list = list.filter(p => p.imageUrl);
    }

    filteredPosts = list;
    renderGrid();
  }

  // ==========================================
  // Render
  // ==========================================
  function renderGrid() {
    const grid = document.getElementById("postsGrid");

    if (filteredPosts.length === 0) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        কোনো পোস্ট নেই
      </div>`;
      return;
    }

    grid.innerHTML = filteredPosts.map(p => {
      const initial = (p.userName || "?")[0].toUpperCase();
      const likes = p.likes?.length || 0;
      const comments = p.commentCount || 0;
      return `
        <div class="post-card" data-id="${p.id}">
          <div class="post-card-img">
            <img src="${p.imageUrl}" alt="" loading="lazy">
            <div class="post-card-badge">
              <span class="post-card-pill">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                ${bnNum(likes)}
              </span>
            </div>
          </div>
          <div class="post-card-body">
            <div class="post-card-author">
              <div class="post-card-avatar">${p.userPhoto ? `<img src="${p.userPhoto}">` : initial}</div>
              <div class="post-card-username">@${escapeHtml(p.username || "—")}</div>
            </div>
            <div class="post-card-caption">${escapeHtml(p.caption || "—")}</div>
            <div class="post-card-time">${p.createdAt?.seconds ? timeAgo(p.createdAt.seconds * 1000) : "—"}</div>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".post-card").forEach(card => {
      card.addEventListener("click", () => {
        const p = filteredPosts.find(x => x.id === card.dataset.id);
        if (p) openModal(p);
      });
    });
  }

  // ==========================================
  // Modal
  // ==========================================
  function openModal(post) {
    const modal = document.getElementById("postModal");
    const box = document.getElementById("postModalBox");
    const content = document.getElementById("postModalContent");

    const initial = (post.userName || "?")[0].toUpperCase();
    const likes = post.likes?.length || 0;
    const comments = post.commentCount || 0;

    content.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink)">পোস্ট বিবরণ</div>
        <button class="admin-btn admin-btn-ghost admin-btn-sm" id="postModalClose">✕</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);border-radius:12px;margin-bottom:16px">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0">
          ${post.userPhoto ? `<img src="${post.userPhoto}" style="width:100%;height:100%;object-fit:cover">` : initial}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;color:var(--ink)">${escapeHtml(post.userName || "—")}</div>
          <div style="font-size:12px;color:var(--ink-mute);font-style:italic;font-family:'Playfair Display',serif">@${escapeHtml(post.username || "—")}</div>
        </div>
      </div>

      <div style="border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:16px;background:var(--paper-2)">
        <img src="${post.imageUrl}" alt="" style="width:100%;display:block;max-height:400px;object-fit:contain;background:#000">
      </div>

      ${post.caption ? `
        <div style="font-size:14px;color:var(--ink-soft);line-height:1.6;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:14px">
          <b style="color:var(--ink);font-family:'Playfair Display',serif">${escapeHtml(post.username || "?")}:</b> ${escapeHtml(post.caption)}
        </div>
      ` : ""}

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px">
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--accent)">${bnNum(likes)}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">লাইক</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--ink)">${bnNum(comments)}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">মন্তব্য</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--ink)">${post.createdAt?.seconds ? timeAgo(post.createdAt.seconds * 1000) : "—"}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">প্রকাশ</div>
        </div>
      </div>

      <div style="display:flex;gap:8px">
        <a href="../user.html?u=${encodeURIComponent(post.username || "")}" target="_blank" class="admin-btn admin-btn-ghost" style="flex:1;text-decoration:none">
          প্রোফাইল দেখুন
        </a>
        <button class="admin-btn admin-btn-danger" id="deletePostBtn" style="flex:1">পোস্ট মুছুন</button>
      </div>
    `;

    modal.style.display = "flex";
    requestAnimationFrame(() => {
      modal.style.opacity = "1";
      box.style.transform = "scale(1)";
    });

    document.getElementById("postModalClose").addEventListener("click", closeModal);
    document.getElementById("deletePostBtn").addEventListener("click", async () => {
      closeModal();
      const ok = await showConfirm(
        "এই পোস্টটি সম্পূর্ণ মুছে ফেলবেন?\n\nএই কাজ ফিরিয়ে আনা যাবে না!",
        { title: "পোস্ট মুছুন", okText: "মুছে ফেলুন", cancelText: "বাতিল" }
      );
      if (!ok) return;
      try {
        await deletePostById(post.id);
        allPosts = allPosts.filter(x => x.id !== post.id);
        applyFilters();
        document.getElementById("postCountBadge").textContent = `${bnNum(allPosts.length)} টি`;
        showToast("✅ পোস্ট মুছে ফেলা হয়েছে", "ok");
      } catch (e) {
        showToast("❌ ব্যর্থ: " + e.message, "err");
      }
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  }

  function closeModal() {
    const modal = document.getElementById("postModal");
    const box = document.getElementById("postModalBox");
    modal.style.opacity = "0";
    box.style.transform = "scale(.94)";
    setTimeout(() => { modal.style.display = "none"; }, 250);
  }

  // ==========================================
  // Helpers
  // ==========================================
  function bnNum(n) {
    const en = "0123456789";
    const bn = "০১২৩৪৫৬৭৮৯";
    return String(n).replace(/[0-9]/g, d => bn[en.indexOf(d)]);
  }

  function timeAgo(t) {
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff} সেঃ আগে`;
    if (diff < 3600) return `${Math.floor(diff / 60)} মিঃ আগে`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} ঘঃ আগে`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} দিন আগে`;
    return new Date(t).toLocaleDateString("bn-BD");
  }

  function emptyState(msg) {
    return `<div style="padding:60px 20px;text-align:center;color:var(--ink-mute);font-size:14px">
      <svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:var(--rule-dark);fill:none;stroke-width:1.4;margin:0 auto 14px;display:block;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      ${msg}
    </div>`;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
