<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — রিল</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="css/admin.css">
<script src="../js/theme.js"></script>
<script src="js/admin-config.js"></script>
<style>
  .reels-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
  }
  .reel-card{
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .reel-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent-border);
    box-shadow:0 10px 28px var(--shadow-md);
  }
  .reel-thumb{
    width:100%;
    aspect-ratio:9/16;
    background:#000;
    position:relative;
    overflow:hidden;
  }
  .reel-thumb video{
    width:100%;height:100%;
    object-fit:cover;
  }
  .reel-play-icon{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:44px;height:44px;
    border-radius:50%;
    background:rgba(0,0,0,.5);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    transition:transform .3s,background .3s;
  }
  .reel-card:hover .reel-play-icon{
    transform:translate(-50%,-50%) scale(1.15);
    background:rgba(45,90,61,.85);
  }
  .reel-play-icon svg{
    width:20px;height:20px;
    fill:#fff;stroke:#fff;
    stroke-width:1.5;
  }
  .reel-badge-top{
    position:absolute;
    top:8px;right:8px;
    background:rgba(0,0,0,.6);
    color:#fff;
    padding:3px 8px;
    border-radius:20px;
    font-size:10px;
    font-weight:700;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:inline-flex;
    align-items:center;
    gap:3px;
  }
  .reel-badge-top svg{
    width:11px;height:11px;
    stroke:currentColor;fill:none;stroke-width:2;
  }
  .reel-body{
    padding:10px 12px 12px;
  }
  .reel-author{
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
  }
  .reel-avatar{
    width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    overflow:hidden;flex-shrink:0;
  }
  .reel-avatar img{width:100%;height:100%;object-fit:cover}
  .reel-username{
    font-size:11.5px;color:var(--ink-mute);font-style:italic;
    font-family:'Playfair Display',serif;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .reel-caption-sm{
    font-size:12.5px;color:var(--ink-soft);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:34px;
  }
  .reel-time{
    font-size:10.5px;color:var(--ink-mute);margin-top:6px;
    font-style:italic;font-family:'Playfair Display',serif;
  }
</style>
</head>
<body class="admin">

<div class="admin-shell">
  <aside id="adminSidebar"></aside>

  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar">
      <div class="admin-topbar-brand">
        রিল
        <span class="admin-badge" id="reelCountBadge">—</span>
      </div>
      <div class="admin-topbar-actions">
        <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <div class="admin-page">
      <div class="admin-page-head">
        <div>
          <div class="admin-page-title">সমস্ত রিল</div>
          <div class="admin-page-sub">সাইটের সব ভিডিও রিল দেখুন ও ব্যবস্থাপনা করুন</div>
        </div>
      </div>

      <div class="admin-search" style="max-width:340px;margin-bottom:18px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ক্যাপশন বা ইউজারনেম...">
      </div>

      <div class="reels-grid" id="reelsGrid">
        <div class="admin-empty" style="grid-column:1/-1">
          <div class="spinner" style="margin:0 auto 12px;border-color:var(--rule);border-top-color:var(--accent)"></div>
          লোড হচ্ছে...
        </div>
      </div>
    </div>
  </div>
</div>

<div id="reelModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s">
  <div id="reelModalBox" style="background:var(--paper-elev);border:1px solid var(--rule);border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.94);transition:transform .3s cubic-bezier(.34,1.56,.64,1)">
    <div id="reelModalContent"></div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from "./js/admin-auth.js";
  import { getAllReels, deleteReelById } from "./js/admin-data.js";
  import { showToast, showConfirm } from "../js/toast.js";
  import "./js/admin-sidebar.js";

  let allReels = [];
  let filtered = [];

  requireAdmin(() => {
    loadReels();
    document.getElementById("searchInput").addEventListener("input", applySearch);
  });

  async function loadReels() {
    const grid = document.getElementById("reelsGrid");
    try {
      allReels = await getAllReels();
      filtered = [...allReels];
      renderGrid();
      document.getElementById("reelCountBadge").textContent = `${bnNum(allReels.length)} টি`;
    } catch (e) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">${e.message}</div>`;
    }
  }

  function applySearch() {
    const t = document.getElementById("searchInput").value.trim().toLowerCase();
    filtered = !t ? [...allReels] : allReels.filter(r =>
      (r.caption || "").toLowerCase().includes(t) ||
      (r.username || "").toLowerCase().includes(t) ||
      (r.userName || "").toLowerCase().includes(t)
    );
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById("reelsGrid");
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg>
        কোনো রিল নেই
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(r => {
      const initial = (r.userName || "?")[0].toUpperCase();
      const likes = r.likes?.length || 0;
      return `
        <div class="reel-card" data-id="${r.id}">
          <div class="reel-thumb">
            <video src="${r.videoUrl}" preload="metadata" muted playsinline></video>
            <div class="reel-play-icon">
              <svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20"/></svg>
            </div>
            <div class="reel-badge-top">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              ${bnNum(likes)}
            </div>
          </div>
          <div class="reel-body">
            <div class="reel-author">
              <div class="reel-avatar">${r.userPhoto ? `<img src="${r.userPhoto}">` : initial}</div>
              <div class="reel-username">@${escapeHtml(r.username || "—")}</div>
            </div>
            <div class="reel-caption-sm">${escapeHtml(r.caption || "—")}</div>
            <div class="reel-time">${r.createdAt?.seconds ? timeAgo(r.createdAt.seconds * 1000) : "—"}</div>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".reel-card").forEach(card => {
      // Hover e video play
      const vid = card.querySelector("video");
      card.addEventListener("mouseenter", () => vid.play().catch(() => {}));
      card.addEventListener("mouseleave", () => { vid.pause(); vid.currentTime = 0; });

      card.addEventListener("click", () => {
        const r = filtered.find(x => x.id === card.dataset.id);
        if (r) openModal(r);
      });
    });
  }

  function openModal(reel) {
    const modal = document.getElementById("reelModal");
    const box = document.getElementById("reelModalBox");
    const content = document.getElementById("reelModalContent");

    const initial = (reel.userName || "?")[0].toUpperCase();
    const likes = reel.likes?.length || 0;

    content.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink)">রিল বিবরণ</div>
        <button class="admin-btn admin-btn-ghost admin-btn-sm" id="reelModalClose">✕</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);border-radius:12px;margin-bottom:14px">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0">
          ${reel.userPhoto ? `<img src="${reel.userPhoto}" style="width:100%;height:100%;object-fit:cover">` : initial}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;color:var(--ink)">${escapeHtml(reel.userName || "—")}</div>
          <div style="font-size:12px;color:var(--ink-mute);font-style:italic;font-family:'Playfair Display',serif">@${escapeHtml(reel.username || "—")}</div>
        </div>
      </div>

      <div style="background:#000;border-radius:12px;overflow:hidden;margin-bottom:14px;max-height:400px">
        <video src="${reel.videoUrl}" controls playsinline style="width:100%;display:block;max-height:400px;background:#000"></video>
      </div>

      ${reel.caption ? `<div style="font-size:14px;color:var(--ink-soft);line-height:1.6;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:14px">
        <b style="color:var(--ink);font-family:'Playfair Display',serif">${escapeHtml(reel.username || "?")}:</b> ${escapeHtml(reel.caption)}
      </div>` : ""}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--accent)">${bnNum(likes)}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">লাইক</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--ink)">${reel.createdAt?.seconds ? timeAgo(reel.createdAt.seconds * 1000) : "—"}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">প্রকাশ</div>
        </div>
      </div>

      <div style="display:flex;gap:8px">
        <a href="../user.html?u=${encodeURIComponent(reel.username || "")}" target="_blank" class="admin-btn admin-btn-ghost" style="flex:1;text-decoration:none">প্রোফাইল দেখুন</a>
        <button class="admin-btn admin-btn-danger" id="deleteReelBtn" style="flex:1">রিল মুছুন</button>
      </div>
    `;

    modal.style.display = "flex";
    requestAnimationFrame(() => {
      modal.style.opacity = "1";
      box.style.transform = "scale(1)";
    });

    document.getElementById("reelModalClose").addEventListener("click", closeModal);
    document.getElementById("deleteReelBtn").addEventListener("click", async () => {
      closeModal();
      const ok = await showConfirm("এই রিলটি সম্পূর্ণ মুছে ফেলবেন?", {
        title: "রিল মুছুন", okText: "মুছে ফেলুন", cancelText: "বাতিল"
      });
      if (!ok) return;
      try {
        await deleteReelById(reel.id);
        allReels = allReels.filter(x => x.id !== reel.id);
        applySearch();
        document.getElementById("reelCountBadge").textContent = `${bnNum(allReels.length)} টি`;
        showToast("✅ রিল মুছে ফেলা হয়েছে", "ok");
      } catch (e) {
        showToast("❌ ব্যর্থ: " + e.message, "err");
      }
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  }

  function closeModal() {
    const modal = document.getElementById("reelModal");
    const box = document.getElementById("reelModalBox");
    modal.style.opacity = "0";
    box.style.transform = "scale(.94)";
    setTimeout(() => { modal.style.display = "none"; }, 250);
  }

  function bnNum(n) {
    const en = "0123456789", bn = "০১২৩৪৫৬৭৮৯";
    return String(n).replace(/[0-9]/g, d => bn[en.indexOf(d)]);
  }

  function timeAgo(t) {
    const d = Math.floor((Date.now() - t) / 1000);
    if (d < 60) return `${d} সেঃ আগে`;
    if (d < 3600) return `${Math.floor(d / 60)} মিঃ আগে`;
    if (d < 86400) return `${Math.floor(d / 3600)} ঘঃ আগে`;
    if (d < 604800) return `${Math.floor(d / 86400)} দিন আগে`;
    return new Date(t).toLocaleDateString("bn-BD");
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
