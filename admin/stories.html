<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — স্টোরি</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="css/admin.css">
<script src="../js/theme.js"></script>
<script src="js/admin-config.js"></script>
<style>
  .stories-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:14px;
  }
  .story-card{
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    position:relative;
  }
  .story-card:hover{
    transform:translateY(-3px);
    border-color:var(--accent-border);
    box-shadow:0 10px 28px var(--shadow-md);
  }
  .story-thumb{
    width:100%;
    aspect-ratio:9/16;
    background:var(--paper-2);
    position:relative;
    overflow:hidden;
  }
  .story-thumb img{
    width:100%;height:100%;object-fit:cover;
    transition:transform .5s cubic-bezier(.22,1,.36,1);
    display:block;
  }
  .story-card:hover .story-thumb img{transform:scale(1.05)}
  .story-status{
    position:absolute;top:8px;left:8px;
    padding:3px 8px;border-radius:20px;
    font-size:10px;font-weight:700;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    letter-spacing:.5px;text-transform:uppercase;
  }
  .story-status.live{
    background:rgba(45,90,61,.9);
    color:#fff;
  }
  .story-status.expired{
    background:rgba(120,120,120,.9);
    color:#fff;
  }
  .story-badge{
    position:absolute;top:8px;right:8px;
    background:rgba(0,0,0,.6);color:#fff;
    padding:3px 8px;border-radius:20px;
    font-size:10px;font-weight:700;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:inline-flex;align-items:center;gap:3px;
  }
  .story-badge svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2}
  .story-body{padding:10px 12px 12px}
  .story-author{
    display:flex;align-items:center;gap:8px;margin-bottom:6px;
  }
  .story-avatar{
    width:22px;height:22px;border-radius:50%;
    background:var(--accent);color:var(--accent-text);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;overflow:hidden;flex-shrink:0;
  }
  .story-avatar img{width:100%;height:100%;object-fit:cover}
  .story-username{
    font-size:11.5px;color:var(--ink-mute);font-style:italic;
    font-family:'Playfair Display',serif;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .story-caption-sm{
    font-size:12.5px;color:var(--ink-soft);line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;min-height:34px;
  }
  .story-time{
    font-size:10.5px;color:var(--ink-mute);margin-top:6px;
    font-style:italic;font-family:'Playfair Display',serif;
  }
</style>
</head>
<body class="admin">

<div class="admin-shell">
  <aside id="adminSidebar"></aside>

  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar">
      <div class="admin-topbar-brand">
        স্টোরি
        <span class="admin-badge" id="storyCountBadge">—</span>
      </div>
      <div class="admin-topbar-actions">
        <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </header>

    <div class="admin-page">
      <div class="admin-page-head">
        <div>
          <div class="admin-page-title">সমস্ত স্টোরি</div>
          <div class="admin-page-sub">সাইটের সব স্টোরি দেখুন ও ব্যবস্থাপনা করুন (২৪ ঘণ্টা পর্যন্ত সক্রিয়)</div>
        </div>
      </div>

      <div class="admin-search" style="max-width:340px;margin-bottom:18px">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="ক্যাপশন বা ইউজারনেম...">
      </div>

      <div class="stories-grid" id="storiesGrid">
        <div class="admin-empty" style="grid-column:1/-1">
          <div class="spinner" style="margin:0 auto 12px;border-color:var(--rule);border-top-color:var(--accent)"></div>
          লোড হচ্ছে...
        </div>
      </div>
    </div>
  </div>
</div>

<div id="storyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s">
  <div id="storyModalBox" style="background:var(--paper-elev);border:1px solid var(--rule);border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.94);transition:transform .3s cubic-bezier(.34,1.56,.64,1)">
    <div id="storyModalContent"></div>
  </div>
</div>

<script type="module">
  import { requireAdmin } from "./js/admin-auth.js";
  import { getAllStories, deleteStoryById } from "./js/admin-data.js";
  import { showToast, showConfirm } from "../js/toast.js";
  import "./js/admin-sidebar.js";

  let allStories = [];
  let filtered = [];

  requireAdmin(() => {
    loadStories();
    document.getElementById("searchInput").addEventListener("input", applySearch);
  });

  async function loadStories() {
    const grid = document.getElementById("storiesGrid");
    try {
      allStories = await getAllStories();
      filtered = [...allStories];
      renderGrid();
      document.getElementById("storyCountBadge").textContent = `${bnNum(allStories.length)} টি`;
    } catch (e) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">${e.message}</div>`;
    }
  }

  function applySearch() {
    const t = document.getElementById("searchInput").value.trim().toLowerCase();
    filtered = !t ? [...allStories] : allStories.filter(s =>
      (s.caption || "").toLowerCase().includes(t) ||
      (s.username || "").toLowerCase().includes(t) ||
      (s.userName || "").toLowerCase().includes(t)
    );
    renderGrid();
  }

  function isLive(story) {
    if (!story.expiresAt) return false;
    const exp = story.expiresAt.seconds ? story.expiresAt.seconds * 1000 : story.expiresAt;
    return Date.now() < exp;
  }

  function renderGrid() {
    const grid = document.getElementById("storiesGrid");
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="admin-empty" style="grid-column:1/-1">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        কোনো স্টোরি নেই
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(s => {
      const initial = (s.userName || "?")[0].toUpperCase();
      const views = s.viewers?.length || 0;
      const live = isLive(s);
      return `
        <div class="story-card" data-id="${s.id}">
          <div class="story-thumb">
            <img src="${s.imageUrl}" alt="" loading="lazy">
            <div class="story-status ${live ? "live" : "expired"}">
              ${live ? "সক্রিয়" : "সমাপ্ত"}
            </div>
            <div class="story-badge">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              ${bnNum(views)}
            </div>
          </div>
          <div class="story-body">
            <div class="story-author">
              <div class="story-avatar">${s.userPhoto ? `<img src="${s.userPhoto}">` : initial}</div>
              <div class="story-username">@${escapeHtml(s.username || "—")}</div>
            </div>
            <div class="story-caption-sm">${escapeHtml(s.caption || "—")}</div>
            <div class="story-time">${s.createdAt?.seconds ? timeAgo(s.createdAt.seconds * 1000) : "—"}</div>
          </div>
        </div>
      `;
    }).join("");

    grid.querySelectorAll(".story-card").forEach(card => {
      card.addEventListener("click", () => {
        const s = filtered.find(x => x.id === card.dataset.id);
        if (s) openModal(s);
      });
    });
  }

  function openModal(story) {
    const modal = document.getElementById("storyModal");
    const box = document.getElementById("storyModalBox");
    const content = document.getElementById("storyModalContent");

    const initial = (story.userName || "?")[0].toUpperCase();
    const views = story.viewers?.length || 0;
    const live = isLive(story);

    content.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink)">স্টোরি বিবরণ</div>
        <button class="admin-btn admin-btn-ghost admin-btn-sm" id="storyModalClose">✕</button>
      </div>

      <div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--paper-2);border-radius:12px;margin-bottom:14px">
        <div style="width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;overflow:hidden;flex-shrink:0">
          ${story.userPhoto ? `<img src="${story.userPhoto}" style="width:100%;height:100%;object-fit:cover">` : initial}
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px;color:var(--ink)">${escapeHtml(story.userName || "—")}</div>
          <div style="font-size:12px;color:var(--ink-mute);font-style:italic;font-family:'Playfair Display',serif">@${escapeHtml(story.username || "—")}</div>
        </div>
        <div class="story-status ${live ? "live" : "expired"}" style="position:static">${live ? "সক্রিয়" : "সমাপ্ত"}</div>
      </div>

      <div style="border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:14px;background:#000;max-height:400px">
        <img src="${story.imageUrl}" alt="" style="width:100%;display:block;max-height:400px;object-fit:contain">
      </div>

      ${story.caption ? `<div style="font-size:14px;color:var(--ink-soft);line-height:1.6;padding:12px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:14px">
        <b style="color:var(--ink);font-family:'Playfair Display',serif">${escapeHtml(story.username || "?")}:</b> ${escapeHtml(story.caption)}
      </div>` : ""}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--accent)">${bnNum(views)}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">ভিউ</div>
        </div>
        <div style="text-align:center;padding:10px;background:var(--paper-2);border-radius:10px">
          <div style="font-family:'Playfair Display',serif;font-size:13px;font-weight:700;color:var(--ink)">${story.createdAt?.seconds ? timeAgo(story.createdAt.seconds * 1000) : "—"}</div>
          <div style="font-size:10.5px;color:var(--ink-mute);letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-top:3px">প্রকাশ</div>
        </div>
      </div>

      <div style="display:flex;gap:8px">
        <a href="../user.html?u=${encodeURIComponent(story.username || "")}" target="_blank" class="admin-btn admin-btn-ghost" style="flex:1;text-decoration:none">প্রোফাইল দেখুন</a>
        <button class="admin-btn admin-btn-danger" id="deleteStoryBtn" style="flex:1">স্টোরি মুছুন</button>
      </div>
    `;

    modal.style.display = "flex";
    requestAnimationFrame(() => {
      modal.style.opacity = "1";
      box.style.transform = "scale(1)";
    });

    document.getElementById("storyModalClose").addEventListener("click", closeModal);
    document.getElementById("deleteStoryBtn").addEventListener("click", async () => {
      closeModal();
      const ok = await showConfirm("এই স্টোরিটি সম্পূর্ণ মুছে ফেলবেন?", {
        title: "স্টোরি মুছুন", okText: "মুছে ফেলুন", cancelText: "বাতিল"
      });
      if (!ok) return;
      try {
        await deleteStoryById(story.id);
        allStories = allStories.filter(x => x.id !== story.id);
        applySearch();
        document.getElementById("storyCountBadge").textContent = `${bnNum(allStories.length)} টি`;
        showToast("✅ স্টোরি মুছে ফেলা হয়েছে", "ok");
      } catch (e) {
        showToast("❌ ব্যর্থ: " + e.message, "err");
      }
    });

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
  }

  function closeModal() {
    const modal = document.getElementById("storyModal");
    const box = document.getElementById("storyModalBox");
    modal.style.opacity = "0";
    box.style.transform = "scale(.94)";
    setTimeout(() => { modal.style.display = "none"; }, 250);
  }

  function bnNum(n) {
    const en = "0123456789", bn = "০১২৩৪৫৬৭৮৯";
    return String(n).replace(/[0-9]/g, d => bn[en.indexOf(d)]);
  }

  function timeAgo(t) {
    const d = Math.floor((Date.now() - t) / 1000);
    if (d < 60) return `${d} সেঃ আগে`;
    if (d < 3600) return `${Math.floor(d / 60)} মিঃ আগে`;
    if (d < 86400) return `${Math.floor(d / 3600)} ঘঃ আগে`;
    return `${Math.floor(d / 86400)} দিন আগে`;
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

</body>
</html>
