<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — ব্যবহারকারী</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<style>
  .profile-header{padding:24px 0 22px;text-align:center;border-bottom:1px solid var(--rule)}
  .profile-avatar{
    width:96px;height:96px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:700;font-size:36px;
    overflow:hidden;margin:0 auto 16px;
    box-shadow:var(--shadow-md);
    border:3px solid var(--paper-elev);
    background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 60%);
  }
  .profile-avatar img{width:100%;height:100%;object-fit:cover}
  .profile-name{
    font-family:'Playfair Display',serif;
    font-size:24px;font-weight:700;
    color:var(--ink);letter-spacing:-.3px;margin-bottom:4px;
  }
  .profile-username{
    font-size:13px;color:var(--ink-mute);
    font-style:italic;font-family:'Playfair Display',serif;
    margin-bottom:10px;
  }
  .profile-bio{
    font-size:13.5px;color:var(--ink-soft);line-height:1.6;
    max-width:320px;margin:0 auto 18px;padding:0 8px;
  }
  .stats-row{
    display:flex;justify-content:center;gap:32px;
    padding:14px 0;
    border-top:1px solid var(--rule);
    border-bottom:1px solid var(--rule);
  }
  .stat{text-align:center}
  .stat-num{
    font-family:'Playfair Display',serif;
    font-size:22px;font-weight:700;color:var(--ink);line-height:1;
  }
  .stat-label{
    font-size:10px;color:var(--ink-mute);
    letter-spacing:1.2px;text-transform:uppercase;
    font-weight:600;margin-top:6px;
  }
  .profile-actions{display:flex;gap:8px;padding:16px 0 0}
  .profile-actions .btn{flex:1}
  .posts-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:3px;padding-top:14px;
  }
  .grid-item{
    aspect-ratio:1/1;overflow:hidden;border-radius:2px;
    background:var(--paper-deep);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
    cursor:pointer;
  }
  .grid-item:hover{transform:translateY(-2px) scale(1.02);z-index:2;box-shadow:var(--shadow-md)}
  .grid-item img{width:100%;height:100%;object-fit:cover}
  .menu-pop{
    position:fixed;
    background:var(--paper-elev);
    border:1px solid var(--rule);
    border-radius:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.28);
    padding:6px;z-index:100;
    display:none;min-width:190px;
  }
  .menu-pop.show{display:block}
  .menu-pop button{
    width:100%;padding:11px 14px;
    border:none;background:transparent;
    color:var(--ink);font-family:inherit;
    font-size:13px;font-weight:500;
    display:flex;align-items:center;gap:10px;
    cursor:pointer;border-radius:9px;
    text-align:left;transition:background .15s;
  }
  .menu-pop button:hover{background:var(--accent-soft);color:var(--accent)}
  .menu-pop button.danger{color:#c62828}
  .menu-pop button.danger:hover{background:rgba(198,40,40,.1)}
  .menu-pop button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
</style>
</head>
<body>

<div class="page">

  <nav class="topbar">
    <div class="topbar-brand" style="font-size:18px">ব্যবহারকারী</div>
    <div class="topbar-actions">
      <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <button class="icon-btn" id="menuBtn" aria-label="Menu" style="display:none">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
      <a href="index.html" class="icon-btn" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      </a>
    </div>
  </nav>

  <div id="loading" class="loading-wrap">
    <div class="spinner"></div>
    <div>লোড হচ্ছে...</div>
  </div>

  <div id="content" style="display:none">
    <div class="profile-header">
      <div class="profile-avatar" id="avatarBig">?</div>
      <div class="profile-name" id="profileName">...</div>
      <div class="profile-username" id="profileUsername">@...</div>
      <div class="profile-bio" id="profileBio"></div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-num" id="postCount">0</div>
          <div class="stat-label">পোস্ট</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="followerCount">0</div>
          <div class="stat-label">অনুসারী</div>
        </div>
        <div class="stat">
          <div class="stat-num" id="followingCount">0</div>
          <div class="stat-label">অনুসরণ</div>
        </div>
      </div>

      <div class="profile-actions" id="actionsRow"></div>
    </div>

    <div class="section-head">পোস্ট</div>
    <div class="posts-grid" id="postsGrid"></div>
  </div>

</div>

<div class="menu-pop" id="menuPop"></div>

<nav class="bottom-nav">
  <a href="index.html"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  <a href="search.html"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg></a>
  <a href="upload.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></a>
  <a href="reels.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg></a>
  <a href="profile.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg></a>
</nav>

<script type="module">
  import { requireAuth, getAllUsersList } from "./js/auth.js";
  import { loadUserPosts, toggleFollow } from "./js/feed.js";
  import { showToast, showConfirm } from "./js/toast.js";
  import { openReportModal } from "./js/report.js";

  let currentUser = null;
  let targetUser = null;

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(window.location.search);
  const targetUsername = params.get("u");

  requireAuth(async (user) => {
    currentUser = user;
    if (!targetUsername) {
      $("loading").innerHTML = `<div class="empty">ব্যবহারকারী নেই</div>`;
      return;
    }
    try {
      const all = await getAllUsersList();
      targetUser = all.find(u => (u.username || "").toLowerCase() === targetUsername.toLowerCase());
      if (!targetUser) {
        $("loading").innerHTML = `<div class="empty">ব্যবহারকারী পাওয়া যায়নি</div>`;
        return;
      }
      $("loading").style.display = "none";
      $("content").style.display = "block";
      await render();
    } catch (e) {
      $("loading").innerHTML = `<div class="empty">❌ ${e.message}</div>`;
    }
  });

  async function render() {
    const u = targetUser;
    const isMe = u.uid === currentUser.uid;
    const isFollowing = (currentUser.following || []).includes(u.uid);
    const initial = (u.name || "?")[0].toUpperCase();

    $("avatarBig").innerHTML = u.photoURL ? `<img src="${u.photoURL}">` : initial;
    $("profileName").textContent = u.name;
    $("profileUsername").textContent = "@" + u.username;
    $("profileBio").textContent = u.bio || "কোনো পরিচিতি নেই";
    $("followerCount").textContent = (u.followers || []).length;
    $("followingCount").textContent = (u.following || []).length;

    // Show menu button only for other users
    if (!isMe) {
      $("menuBtn").style.display = "flex";
      $("menuBtn").onclick = (e) => openUserMenu(e, u);
    }

    const actionsRow = $("actionsRow");
    if (isMe) {
      actionsRow.innerHTML = `<a href="profile.html" class="btn btn-ghost" style="flex:1">আমার প্রোফাইল</a>`;
    } else {
      actionsRow.innerHTML = `
        <button class="btn ${isFollowing ? "btn-ghost" : ""}" id="followBtn" style="flex:1">
          ${isFollowing ? "অনুসরণ করছেন ✓" : "অনুসরণ করুন"}
        </button>
        <button class="btn btn-ghost" id="msgBtn" style="flex:1">
          <svg viewBox="0 0 24 24" width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          বার্তা
        </button>
      `;
      $("followBtn").addEventListener("click", async (e) => {
        e.target.disabled = true;
        try {
          const nowFollowing = await toggleFollow(u.uid);
          e.target.textContent = nowFollowing ? "অনুসরণ করছেন ✓" : "অনুসরণ করুন";
          e.target.classList.toggle("btn-ghost", nowFollowing);
          const countEl = $("followerCount");
          countEl.textContent = parseInt(countEl.textContent) + (nowFollowing ? 1 : -1);
        } catch (err) { showToast(err.message, "err"); }
        e.target.disabled = false;
      });
      $("msgBtn").addEventListener("click", () => {
        window.location.href = `chat.html?to=${encodeURIComponent(u.username)}`;
      });
    }

    const posts = await loadUserPosts(u.uid);
    $("postCount").textContent = posts.length;
    const grid = $("postsGrid");
    if (posts.length === 0) {
      grid.innerHTML = `<div class="empty" style="grid-column:1/-1">কোনো পোস্ট নেই</div>`;
    } else {
      grid.innerHTML = posts.map(p =>
        `<div class="grid-item" data-id="${p.id}"><img src="${p.imageUrl}" alt="post" loading="lazy"></div>`
      ).join("");
      grid.querySelectorAll(".grid-item").forEach(item => {
        item.addEventListener("click", () => {
          const p = posts.find(x => x.id === item.dataset.id);
          if (p) window.location.href = `index.html#post-${p.id}`;
        });
      });
    }
  }

  // ==========================================
  // User menu (3 dot)
  // ==========================================
  function openUserMenu(e, user) {
    e.stopPropagation();
    const pop = $("menuPop");
    pop.innerHTML = `
      <button data-act="report" class="danger">
        <svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        রিপোর্ট করুন
      </button>
      <button data-act="copy">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        প্রোফাইল লিংক কপি
      </button>
      <button data-act="block" class="danger">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        ব্লক করুন
      </button>
    `;
    pop.classList.add("show");
    const rect = pop.getBoundingClientRect();
    let left = e.clientX - rect.width + 10;
    let top = e.clientY + 10;
    if (left < 10) left = 10;
    if (left + rect.width > window.innerWidth - 10) left = window.innerWidth - rect.width - 10;
    if (top + rect.height > window.innerHeight - 10) top = window.innerHeight - rect.height - 10;
    pop.style.left = left + "px";
    pop.style.top = top + "px";

    pop.querySelectorAll("button").forEach(b => {
      b.onclick = async () => {
        const act = b.dataset.act;
        pop.classList.remove("show");

        if (act === "report") {
          openReportModal({
            targetType: "user",
            targetId: user.uid,
            targetUsername: user.username
          }, () => showToast("✅ রিপোর্ট পাঠানো হয়েছে", "ok"));
        } else if (act === "copy") {
          try {
            await navigator.clipboard.writeText(location.origin + "/bondhu/user.html?u=" + user.username);
            showToast("লিংক কপি হয়েছে", "ok");
          } catch (err) { showToast("কপি ব্যর্থ", "err"); }
        } else if (act === "block") {
          showToast("ব্লক ফিচার শীঘ্রই আসছে", "info");
        }
      };
    });
  }

  document.addEventListener("click", (e) => {
    if (!$("menuPop").contains(e.target)) $("menuPop").classList.remove("show");
  });

  // ==========================================
  // Also allow reporting individual posts via long-press
  // ==========================================
  document.addEventListener("contextmenu", (e) => {
    const gridItem = e.target.closest(".grid-item");
    if (!gridItem) return;
    if (!targetUser || targetUser.uid === currentUser.uid) return;
    e.preventDefault();
    const postId = gridItem.dataset.id;
    openReportModal({
      targetType: "post",
      targetId: postId,
      targetUsername: targetUser.username
    }, () => showToast("✅ পোস্ট রিপোর্ট হয়েছে", "ok"));
  });
</script>

</body>
</html>
