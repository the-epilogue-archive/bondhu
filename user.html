<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু - User</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; background: #fafafa; margin: 0; padding-bottom: 30px; }
    .topbar {
      background: white; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #eee;
    }
    .topbar h1 { color: #e1306c; margin: 0; font-size: 22px; }
    .topbar a { color: #e1306c; text-decoration: none; font-weight: bold; font-size: 14px; }
    .profile { max-width: 500px; margin: 0 auto; padding: 20px 16px; }
    .profile-head { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    .avatar-big {
      width: 90px; height: 90px; border-radius: 50%;
      background: linear-gradient(135deg, #feda75, #d62976);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 36px; font-weight: bold;
      overflow: hidden; flex-shrink: 0;
    }
    .avatar-big img { width: 100%; height: 100%; object-fit: cover; }
    .stats { display: flex; gap: 20px; margin-top: 6px; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 18px; }
    .stat span { color: #888; font-size: 13px; }
    .name { font-size: 18px; font-weight: bold; }
    .username { color: #666; font-size: 14px; }
    .bio { font-size: 14px; color: #333; margin: 12px 0; }
    .btn-row { display: flex; gap: 8px; margin-top: 4px; }
    .action-btn {
      flex: 1; padding: 10px; border-radius: 8px;
      font-size: 14px; font-weight: bold; cursor: pointer;
      border: none;
    }
    .follow-btn { background: #e1306c; color: white; }
    .follow-btn.following { background: #efefef; color: #333; }
    .msg-btn { background: #efefef; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-top: 20px; }
    .grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #eee; }
    .empty { text-align: center; color: #999; padding: 40px; grid-column: 1 / -1; }
    #loading { text-align: center; padding: 40px; color: #999; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Profile</h1>
    <a href="index.html">← Feed</a>
  </div>

  <div class="profile" id="profile">
    <div id="loading">Loading...</div>
  </div>

  <script type="module">
    import { requireAuth, getAllUsersList } from "./js/auth.js";
    import { loadUserPosts, toggleFollow } from "./js/feed.js";

    let currentUser = null;
    let targetUser = null;

    const params = new URLSearchParams(window.location.search);
    const targetUsername = params.get("u");

    requireAuth(async (user) => {
      currentUser = user;

      if (!targetUsername) {
        document.getElementById("profile").innerHTML =
          `<div class="empty">User nei</div>`;
        return;
      }

      try {
        const all = await getAllUsersList();
        targetUser = all.find(u =>
          (u.username || "").toLowerCase() === targetUsername.toLowerCase()
        );

        if (!targetUser) {
          document.getElementById("profile").innerHTML =
            `<div class="empty">User pawa jay ni</div>`;
          return;
        }

        await render();
      } catch (e) {
        document.getElementById("profile").innerHTML =
          `<div class="empty">❌ ${e.message}</div>`;
      }
    });

    async function render() {
      const u = targetUser;
      const isMe = u.uid === currentUser.uid;
      const isFollowing = (currentUser.following || []).includes(u.uid);
      const initial = (u.name || "?")[0].toUpperCase();

      const container = document.getElementById("profile");
      container.innerHTML = `
        <div class="profile-head">
          <div class="avatar-big">
            ${u.photoURL ? `<img src="${u.photoURL}">` : initial}
          </div>
          <div style="flex:1;">
            <div class="name">${escapeHtml(u.name)}</div>
            <div class="username">@${escapeHtml(u.username)}</div>
            <div class="stats">
              <div class="stat"><b id="postCount">0</b><span>Post</span></div>
              <div class="stat"><b>${(u.followers || []).length}</b><span>Follower</span></div>
              <div class="stat"><b>${(u.following || []).length}</b><span>Following</span></div>
            </div>
          </div>
        </div>
        <div class="bio">${escapeHtml(u.bio || "Kono bio nei")}</div>
        ${isMe ? "" : `
          <div class="btn-row">
            <button class="action-btn follow-btn ${isFollowing ? "following" : ""}" id="followBtn">
              ${isFollowing ? "Following ✓" : "Follow koro"}
            </button>
            <button class="action-btn msg-btn" id="msgBtn">
              💬 Message
            </button>
          </div>
        `}
        <div class="grid" id="grid"></div>
      `;

      // Follow + Message button handler
      if (!isMe) {
        document.getElementById("followBtn").addEventListener("click", async (e) => {
          e.target.disabled = true;
          try {
            const nowFollowing = await toggleFollow(u.uid);
            e.target.textContent = nowFollowing ? "Following ✓" : "Follow koro";
            e.target.classList.toggle("following", nowFollowing);
          } catch (err) {
            alert("Follow fail: " + err.message);
          }
          e.target.disabled = false;
        });

        document.getElementById("msgBtn").addEventListener("click", () => {
          window.location.href = `chat.html?to=${encodeURIComponent(u.username)}`;
        });
      }

      // Posts grid
      try {
        const posts = await loadUserPosts(u.uid);
        document.getElementById("postCount").textContent = posts.length;
        const grid = document.getElementById("grid");
        if (posts.length === 0) {
          grid.innerHTML = `<div class="empty">Kono post nei</div>`;
        } else {
          grid.innerHTML = posts.map(p =>
            `<img src="${p.imageUrl}" alt="post">`
          ).join("");
        }
      } catch (e) {
        console.error(e);
      }
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
