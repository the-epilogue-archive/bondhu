<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f0e2">
<title>বন্ধু — ফিড</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
</head>
<body>

<div class="page">

  <!-- ============ MASTHEAD ============ -->
  <header class="masthead">
    <div class="date-line">
      <span id="todayDate">শুক্রবার</span>
      <span>বন্ধু পরিবার</span>
    </div>
    <div class="rule-top"></div>
    <div class="rule-top-2"></div>
    <div class="logo-wrap">
      <div class="logo-ornament"></div>
      <div class="logo">বন্ধু<em>.</em></div>
      <div class="logo-ornament right"></div>
    </div>
    <div class="tagline">— গল্প, সংবাদ ও দৈনন্দিন —</div>
    <div class="rule-bottom"></div>
    <div class="rule-bottom-2"></div>
  </header>

  <!-- ============ TOPBAR (icons only) ============ -->
  <nav class="topbar" style="border-top:0;padding-top:14px">
    <div class="topbar-brand" style="font-size:15px;letter-spacing:.5px;font-family:'Hind Siliguri',sans-serif;font-weight:600">
      <span id="welcomeName">স্বাগতম</span>
    </div>
    <div class="topbar-actions">
      <button class="theme-toggle" onclick="toggleBondhuTheme()" aria-label="Theme toggle">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
      <a href="search.html" class="icon-btn" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
      </a>
      <a href="reels.html" class="icon-btn" aria-label="Reels">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg>
      </a>
      <a href="chat.html" class="icon-btn" aria-label="Chat">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </a>
      <a href="notifications.html" class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge" id="notifBadge" style="display:none">0</span>
      </a>
      <a href="profile.html" class="icon-btn" aria-label="Profile">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/></svg>
      </a>
    </div>
  </nav>

  <!-- ============ STORY BAR ============ -->
  <div class="section-head">আজকের লেখক</div>
  <div class="stories" id="storyBar"></div>

  <!-- ============ FEED ============ -->
  <main class="feed rule-top-divide" id="feed">
    <div class="loading-wrap">
      <div class="spinner"></div>
      <div>ফিড লোড হচ্ছে...</div>
    </div>
  </main>

</div>

<!-- ============ FAB ============ -->
<a href="upload.html" class="fab" aria-label="New post">
  <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</a>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <a href="index.html" class="active" aria-label="Home">
    <svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </a>
  <a href="search.html" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
  </a>
  <a href="upload.html" aria-label="Create">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
  </a>
  <a href="reels.html" aria-label="Reels">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M9 8v8l6-4z"/></svg>
  </a>
  <a href="chat.html" aria-label="Chat">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </a>
</nav>

<!-- ============ SCRIPTS ============ -->
<script type="module">
  import { requireAuth, logout } from "./js/auth.js";
  import { loadFeed, toggleLike, deletePost, addComment, loadComments } from "./js/feed.js";
  import { loadActiveStories } from "./js/stories.js";
  import { getUnreadCount } from "./js/notifications.js";

  let currentUser = null;

  // Aaj er date set koro
  const bnDays = ["রবিবার","সোমবার","মঙ্গলবার","বুধবার","বৃহস্পতিবার","শুক্রবার","শনিবার"];
  const bnMonths = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const d = new Date();
  document.getElementById("todayDate").textContent = bnDays[d.getDay()];

  requireAuth(async (user) => {
    currentUser = user;
    document.getElementById("welcomeName").textContent = (user.name || "স্বাগতম");
    loadStories();
    loadPosts();
    loadNotifBadge();
  });

  async function loadNotifBadge() {
    try {
      const count = await getUnreadCount();
      if (count > 0) {
        const badge = document.getElementById("notifBadge");
        badge.textContent = count > 9 ? "9+" : count;
        badge.style.display = "flex";
      }
    } catch (e) {}
  }

  async function loadStories() {
    const bar = document.getElementById("storyBar");
    try {
      const groups = await loadActiveStories();
      const myGroup = groups.find(g => g.userId === currentUser.uid);

      let html = "";
      if (myGroup) {
        const initial = (currentUser.name || "?")[0].toUpperCase();
        html += `
          <a class="story" href="story.html?u=${encodeURIComponent(currentUser.username)}">
            <div class="story-ring">
              <div class="story-av">${currentUser.photoURL ? `<img src="${currentUser.photoURL}">` : initial}</div>
            </div>
            <div class="story-name">তোমার</div>
          </a>`;
      } else {
        const initial = (currentUser.name || "?")[0].toUpperCase();
        html += `
          <a class="story" href="story-upload.html">
            <div class="story-ring mine">
              <div class="story-av plus">+</div>
            </div>
            <div class="story-name">তোমার</div>
          </a>`;
      }

      groups.forEach(g => {
        if (g.userId === currentUser.uid) return;
        const initial = (g.userName || "?")[0].toUpperCase();
        html += `
          <a class="story" href="story.html?u=${encodeURIComponent(g.username)}">
            <div class="story-ring">
              <div class="story-av">${g.userPhoto ? `<img src="${g.userPhoto}">` : initial}</div>
            </div>
            <div class="story-name">${escapeHtml(g.userName)}</div>
          </a>`;
      });
      bar.innerHTML = html;
    } catch (e) {
      console.error(e);
      bar.innerHTML = "";
    }
  }

  async function loadPosts() {
    const feed = document.getElementById("feed");
    try {
      const posts = await loadFeed();
      const me = currentUser;

      if (posts.length === 0) {
        feed.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            এখনো কোনো পোস্ট নেই<br>
            <a href="upload.html" style="color:var(--accent);font-weight:600;display:inline-block;margin-top:12px">+ প্রথম পোস্ট লিখুন</a>
          </div>`;
        return;
      }

      feed.innerHTML = "";
      posts.forEach(p => {
        const isLiked = p.likes?.includes(me.uid);
        const isMine = p.userId === me.uid;
        const initial = (p.userName || "?")[0].toUpperCase();
        const commentCount = p.commentCount || 0;
        const time = p.createdAt?.seconds ? timeAgo(p.createdAt.seconds * 1000) : "এইমাত্র";

        const div = document.createElement("article");
        div.className = "post";
        div.innerHTML = `
          <div class="post-meta">
            <span class="cat">পোস্ট</span>
            <span>${time}</span>
          </div>
          <a href="user.html?u=${encodeURIComponent(p.username || "")}" class="author">
            <div class="author-avatar">${p.userPhoto ? `<img src="${p.userPhoto}">` : initial}</div>
            <div class="author-info">
              <div class="author-name">${escapeHtml(p.userName || "?")}</div>
              <div class="author-role">@${escapeHtml(p.username || "?")}</div>
            </div>
          </a>
          <div class="plate">
            <img src="${p.imageUrl}" alt="post" loading="lazy">
          </div>
          ${p.caption ? `<div class="body-text"><b>${escapeHtml(p.username)} লিখেছেন:</b> ${escapeHtml(p.caption)}</div>` : ""}
          <div class="acts">
            <button class="act-btn like-btn ${isLiked ? "liked" : ""}" data-id="${p.id}">
              <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              <span class="like-count">${p.likes?.length || 0}</span>
            </button>
            <button class="act-btn comment-toggle-btn" data-id="${p.id}">
              <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              <span>${commentCount}</span>
            </button>
            <button class="act-btn share-btn" data-url="${location.origin}/bondhu/index.html">
              <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              <span>শেয়ার</span>
            </button>
            ${isMine ? `
              <button class="act-btn danger delete-btn" data-id="${p.id}" style="margin-left:auto">
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/></svg>
              </button>
            ` : ""}
          </div>
          <div class="comments-section" id="cs-${p.id}" style="display:none;padding-top:14px;border-top:1px solid var(--rule);margin-top:14px">
            <div class="comments-list" id="cl-${p.id}" style="font-size:13px;color:var(--ink-soft);line-height:1.7"></div>
            <div style="display:flex;gap:8px;margin-top:10px">
              <input class="input comment-input" placeholder="মন্তব্য লিখুন..." data-id="${p.id}" style="flex:1;padding:9px 14px;font-size:13px">
              <button class="act-btn comment-send" data-id="${p.id}" style="background:var(--accent);color:var(--accent-text);padding:9px 16px;font-size:12px">পাঠান</button>
            </div>
          </div>
        `;
        feed.appendChild(div);
      });

      // Like handler
      feed.querySelectorAll(".like-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const postId = btn.dataset.id;
          const post = posts.find(x => x.id === postId);
          btn.disabled = true;
          try {
            const nowLiked = await toggleLike(postId, post.likes || []);
            btn.classList.toggle("liked", nowLiked);
            const span = btn.querySelector(".like-count");
            const prev = post.likes?.length || 0;
            span.textContent = prev + (nowLiked ? 1 : -1);
          } catch (e) { console.error(e); }
          btn.disabled = false;
        });
      });

      // Comment toggle
      feed.querySelectorAll(".comment-toggle-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const postId = btn.dataset.id;
          const section = document.getElementById("cs-" + postId);
          const open = section.style.display === "block";
          section.style.display = open ? "none" : "block";
          if (!open) await renderComments(postId);
        });
      });

      // Comment send
      feed.querySelectorAll(".comment-send").forEach(btn => {
        btn.addEventListener("click", async () => {
          const postId = btn.dataset.id;
          const input = document.querySelector(`.comment-input[data-id="${postId}"]`);
          const text = input.value.trim();
          if (!text) return;
          btn.disabled = true;
          try {
            await addComment(postId, text);
            input.value = "";
            await renderComments(postId);
          } catch (e) { console.error(e); }
          btn.disabled = false;
        });
      });

      // Share
      feed.querySelectorAll(".share-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          const url = btn.dataset.url;
          if (navigator.share) {
            try { await navigator.share({ title: "বন্ধু", url }); } catch (e) {}
          } else {
            navigator.clipboard.writeText(url);
            alert("লিংক কপি হয়েছে!");
          }
        });
      });

      // Delete
      feed.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("এই পোস্টটি মুছে ফেলবেন?")) return;
          try {
            await deletePost(btn.dataset.id);
            btn.closest(".post").remove();
          } catch (e) { alert("Delete fail: " + e.message); }
        });
      });
    } catch (e) {
      feed.innerHTML = `<div class="empty">❌ ${e.message}</div>`;
      console.error(e);
    }
  }

  async function renderComments(postId) {
    const list = document.getElementById("cl-" + postId);
    try {
      const comments = await loadComments(postId);
      if (comments.length === 0) {
        list.innerHTML = `<div style="color:var(--ink-mute);font-size:13px;font-style:italic">কোনো মন্তব্য নেই</div>`;
      } else {
        list.innerHTML = comments.map(c =>
          `<div style="margin-bottom:6px"><b style="font-family:'Playfair Display',serif;color:var(--ink)">@${escapeHtml(c.username)}</b> ${escapeHtml(c.text)}</div>`
        ).join("");
      }
    } catch (e) {
      list.innerHTML = `<div style="color:#c62828;font-size:12px">লোড ব্যর্থ</div>`;
    }
  }

  function timeAgo(t) {
    const diff = Math.floor((Date.now() - t) / 1000);
    if (diff < 60) return `${diff} সেকেন্ড আগে`;
    if (diff < 3600) return `${Math.floor(diff / 60)} মিনিট আগে`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} ঘণ্টা আগে`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} দিন আগে`;
    return new Date(t).toLocaleDateString("bn-BD");
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[m]));
  }
</script>

<script>
  // Service Worker
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/bondhu/sw.js").catch(() => {});
    });
  }
</script>

</body>
</html>
