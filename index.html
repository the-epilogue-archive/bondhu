<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বন্ধু</title>
  <style>
    body {
      font-family: sans-serif;
      background: #fafafa;
      padding: 20px;
      max-width: 500px;
      margin: 0 auto;
      text-align: center;
    }
    h1 { color: #e1306c; }
    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: left;
    }
    button {
      background: #e1306c;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin: 4px;
    }
    button.secondary { background: #666; }
    .nav { margin-top: 20px; }
    .nav a {
      color: #e1306c;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    #welcome {
      background: #d4edda;
      color: #155724;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }
    #loading { color: #666; padding: 40px; }
  </style>
</head>
<body>
  <h1>বন্ধু 🚀</h1>

  <div id="loading">Loading...</div>

  <div id="content" style="display:none;">
    <div id="welcome"></div>

    <div class="box">
      <h3>Feed ekhon khali</h3>
      <p style="color:#666; font-size:14px;">
        Ekhon tui login korecho. Pore step 5-6 e feed, post, profile add korbo.
      </p>
    </div>

    <div class="nav">
      <a href="settings.html">⚙️ Settings</a>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>
  </div>

  <script type="module">
    import { requireAuth, getUserData, logout } from "./js/auth.js";

    const loading = document.getElementById("loading");
    const content = document.getElementById("content");
    const welcome = document.getElementById("welcome");

    // Login na korle login.html e pathabe
    requireAuth(async (user) => {
      loading.style.display = "none";
      content.style.display = "block";

      const data = await getUserData(user.uid);
      const name = data?.name || user.displayName || "Bondhu";
      welcome.textContent = `স্বাগতম, ${name}! 👋`;
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await logout();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
